<template>
    <div class="zc-root">

        <!-- ══════════════════════════════════════════════════════════════
             LEFT PANEL — ticket list (always visible)
        ══════════════════════════════════════════════════════════════ -->
        <div class="left-panel">

            <div class="left-panel__header">
                <div class="left-panel__title">Zeffy Connect</div>
                <button class="icon-btn" onclick={handleRefresh} title={lbl.ttRefresh}>
                    <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                </button>
                <button class={headerSettingsClass} onclick={handleOpenSettings} title={lbl.ttSettings}>
                    <lightning-icon icon-name="utility:settings" size="x-small"></lightning-icon>
                </button>
            </div>

            <div class="left-panel__search">
                <input type="search"
                       class="search-input"
                       placeholder={lbl.searchPlaceholder}
                       value={searchText}
                       oninput={handleSearch} />
            </div>

            <div class="left-panel__filter">
                <lightning-combobox
                    label=""
                    variant="label-hidden"
                    value={statusFilter}
                    options={statusOptions}
                    onchange={handleStatusChange}>
                </lightning-combobox>
            </div>

            <div class="left-panel__count-row">
                <span class="left-panel__count">{ticketCountLabel}</span>
                <template if:true={showListPagination}>
                    <div class="lp-page-nav">
                        <button class="lp-pag-btn" disabled={listPrevDisabled}
                                onclick={handleListPrevPage} title={lbl.pagePrev}>&#8249;</button>
                        <template if:false={listEditingPage}>
                            <span class="lp-page-label"
                                  onclick={handleListPageLabelClick}
                                  title={lbl.pageJumpHint}>{listPageLabel}</span>
                        </template>
                        <template if:true={listEditingPage}>
                            <input type="number" class="lp-page-input"
                                   min="1" max={listTotalPages}
                                   onkeydown={handleListPageInputKey}
                                   onblur={handleListPageInputBlur} />
                        </template>
                        <button class="lp-pag-btn" disabled={listNextDisabled}
                                onclick={handleListNextPage} title={lbl.pageNext}>&#8250;</button>
                    </div>
                </template>
            </div>

            <template if:true={isLoading}>
                <div class="loading-container">
                    <lightning-spinner size="small" alternative-text={lbl.loading}></lightning-spinner>
                </div>
            </template>

            <template if:false={isLoading}>
                <div class="ticket-list">
                    <template if:true={hasFilteredTickets}>
                        <template for:each={pagedTickets} for:item="t">
                            <!-- Group head — shows stacked card effect + expand button -->
                            <template if:true={t.isGroupHead}>
                                <div key={t.Id} class="ticket-group-wrap">
                                    <div class={t.dupStackClass}>
                                        <div class={t.cardClass} data-id={t.Id} onclick={handleSelectTicket}>
                                            <div class="ticket-card__top-row">
                                                <div class="ticket-card__num">{t.Name}</div>
                                                <template if:true={t.holdingCountdown}>
                                                    <span class={t.holdingCountdown.cssClass} title={t.holdingCountdown.tooltip}>{t.holdingCountdown.label}</span>
                                                </template>
                                            </div>
                                            <div class="ticket-card__name">{t.donorName}</div>
                                            <div class="ticket-card__meta">
                                                <span class="ticket-card__amount">{t.amountDisplay}</span>
                                                <span class="ticket-card__date">{t.dateDisplay}</span>
                                            </div>
                                            <div class="ticket-card__footer">
                                                <span class={t.statusBadgeClass} title={t.statusTooltip}>{t.statusLabel}</span>
                                                <template if:true={t.needsAmountReview}>
                                                    <span class="amount-fix-chip" title={lbl.amtReviewTitle}>⚠ {lbl.amtReviewChip}</span>
                                                </template>
                                                <template if:true={t.hasDispute}>
                                                    <span class="amount-fix-chip">{t.disputeChip}</span>
                                                </template>
                                                <template if:true={t.hasRefund}>
                                                    <span class="assignee-badge">{t.refundChip}</span>
                                                </template>
                                                <template if:true={t.addressDiffers}>
                                                    <span class="addr-diff-chip" title={lbl.addrDiffTitle}>{lbl.chipAddrDiffers}</span>
                                                </template>
                                                <template if:true={t.Manual_Assignee_Name__c}>
                                                    <span class="assignee-badge">
                                                        <lightning-icon icon-name="utility:user" size="xx-small" class="assignee-badge__icon"></lightning-icon>
                                                        {t.Manual_Assignee_Name__c}
                                                    </span>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                    <template if:false={t.groupExpanded}>
                                        <div class="group-action-row">
                                            <button class="dup-expand-btn" data-cid={t.groupCid} onclick={handleToggleDupGroup}>
                                                {t.expandLabel}
                                            </button>
                                            <template if:true={t.hasBulkPending}>
                                                <button class="bulk-resolve-btn" data-cid={t.groupCid} disabled={bulkResolving} onclick={handleBulkResolveGroup}>
                                                    {t.bulkResolveLabel}
                                                </button>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <!-- Group end (only when expanded): actions below the last ticket, then separator -->
                            <template if:true={t.isGroupSeparator}>
                                <div key={t.Id} class="group-end">
                                    <div class="group-action-row group-action-row--end">
                                        <button class="dup-expand-btn" data-cid={t.groupCid} onclick={handleToggleDupGroup}>
                                            {t.expandLabel}
                                        </button>
                                        <template if:true={t.hasBulkPending}>
                                            <button class="bulk-resolve-btn" data-cid={t.groupCid} disabled={bulkResolving} onclick={handleBulkResolveGroup}>
                                                {t.bulkResolveLabel}
                                            </button>
                                        </template>
                                    </div>
                                    <div class="group-end-separator"></div>
                                </div>
                            </template>
                            <!-- Regular card or expanded extra card -->
                            <template if:false={t.isGroupHead}>
                                <template if:false={t.isGroupSeparator}>
                                    <div key={t.Id} class={t.cardClass} data-id={t.Id} onclick={handleSelectTicket}>
                                        <div class="ticket-card__top-row">
                                            <div class="ticket-card__num">{t.Name}</div>
                                            <template if:true={t.holdingCountdown}>
                                                <span class={t.holdingCountdown.cssClass} title={t.holdingCountdown.tooltip}>{t.holdingCountdown.label}</span>
                                            </template>
                                        </div>
                                        <div class="ticket-card__name">{t.donorName}</div>
                                        <div class="ticket-card__meta">
                                            <span class="ticket-card__amount">{t.amountDisplay}</span>
                                            <span class="ticket-card__date">{t.dateDisplay}</span>
                                        </div>
                                        <div class="ticket-card__footer">
                                            <span class={t.statusBadgeClass} title={t.statusTooltip}>{t.statusLabel}</span>
                                            <template if:true={t.needsAmountReview}>
                                                <span class="amount-fix-chip" title={lbl.amtReviewTitle}>⚠ {lbl.amtReviewChip}</span>
                                            </template>
                                            <template if:true={t.hasDispute}>
                                                <span class="amount-fix-chip">{t.disputeChip}</span>
                                            </template>
                                            <template if:true={t.hasRefund}>
                                                <span class="assignee-badge">{t.refundChip}</span>
                                            </template>
                                            <template if:true={t.addressDiffers}>
                                                <span class="addr-diff-chip" title={lbl.addrDiffTitle}>{lbl.chipAddrDiffers}</span>
                                            </template>
                                            <template if:true={t.Manual_Assignee_Name__c}>
                                                <span class="assignee-badge">
                                                    <lightning-icon icon-name="utility:user" size="xx-small" class="assignee-badge__icon"></lightning-icon>
                                                    {t.Manual_Assignee_Name__c}
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </template>
                        </template>
                    </template>
                    <template if:false={hasFilteredTickets}>
                        <div class="empty-list">{lbl.noTickets}</div>
                    </template>
                </div>
            </template>
        </div>

        <!-- ══════════════════════════════════════════════════════════════
             RIGHT PANEL — workspace tabs (Dashboard + Audit Log + ticket cejas)
        ══════════════════════════════════════════════════════════════ -->
        <div class="right-panel">

            <!-- ── Warning: Holding auto-expire left off > 12 h ─────────── -->
            <template if:true={showExpireOffBanner}>
                <div class="expire-off-banner" role="alert">
                    <lightning-icon icon-name="utility:warning" size="x-small" class="expire-off-banner__icon"></lightning-icon>
                    <div class="expire-off-banner__text">
                        <strong>{lbl.expireOffTitle}</strong>
                        <span>{expireOffMessage}</span>
                    </div>
                    <button class="expire-off-banner__btn" onclick={handleReenableHoldingExpire} disabled={isReenablingExpire}>
                        {lbl.expireOffBtn}
                    </button>
                </div>
            </template>

            <!-- ── TAB BAR ────────────────────────────────────────────────── -->
            <div class="rp-tab-bar">
                <!-- Permanent tabs -->
                <button class={rpDashboardClass} data-tab="dashboard" onclick={handleRightTabChange}>
                    {lbl.tabDashboard}
                </button>
                <!-- Logs = Donation History + Audit Log; always opens on Donation History -->
                <button class={rpLogsClass} data-tab="history" onclick={handleRightTabChange}>
                    {lbl.tabLogs}
                </button>
                <button class={rpMyTasksClass} data-tab="mytasks" onclick={handleRightTabChange}>
                    {lbl.tabMyTasks}
                    <template if:true={myTasksBadge}>
                        <span class="rp-tab-badge">{myTasksBadge}</span>
                    </template>
                </button>
                <!-- Separator (only shown when ticket tabs exist) -->
                <template if:true={hasOpenTabs}>
                    <div class="rp-tab-separator"></div>
                </template>

                <!-- Dynamic ticket tabs (one per open ticket, like DUC) -->
                <template for:each={openTabsList} for:item="tab">
                    <div key={tab.id} class={tab.tabClass} data-id={tab.id} onclick={handleActivateTab} role="button">
                        <span class="rp-tab-ticket-name">{tab.donorName}</span>
                        <button class="rp-tab-close-btn" data-id={tab.id} onclick={handleCloseTab} title={lbl.ttClose}>×</button>
                    </div>
                </template>
            </div>

            <!-- ── DASHBOARD TAB ───────────────────────────────────────────── -->
            <template if:true={isRightTabDashboard}>
                <div class="rp-content dash">

                    <div class="dash-top">
                        <h3>{lbl.dashOverview}</h3>
                        <span class="dash-hint">{lbl.dashTilesHint}</span>
                    </div>

                    <div class="tiles">
                        <div class={cardTotalClass} data-filter="All" data-card="total" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{totalCount}</b>
                            <span>{lbl.statTotal}</span>
                        </div>
                        <div class={cardPendingClass} data-filter="Pending Review" data-card="pending" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{pendingCount}</b>
                            <span>{lbl.statPending}</span>
                        </div>
                        <div class={cardResolvedClass} data-filter="Resolved" data-card="resolved" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{resolvedCount}</b>
                            <span>{lbl.statResolved}</span>
                        </div>
                        <div class={cardErrorClass} data-filter="ClosedAll" data-card="error" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{errorCount}</b>
                            <span>{lbl.statErrors}</span>
                        </div>
                        <div class={cardDelayedClass} data-filter="Delayed" data-card="delayed" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{delayedCount}</b>
                            <span>{lbl.statDelayed}</span>
                        </div>
                        <div class={cardClosedClass} data-filter="ClosedAll" data-card="closed" role="button" tabindex="0" title={lbl.cardFilterHint}
                             onclick={handleStatCardFilter} onkeydown={handleStatCardKey}>
                            <b>{closedCount}</b>
                            <span>{lbl.statClosed}</span>
                        </div>
                    </div>

                    <div class="dash-two">
                        <!-- Tickets per week: created vs closed -->
                        <div class="card2">
                            <h4>{lbl.chartWeekly}
                                <span class="card2__nav">
                                    <button class="chart-nav-btn" onclick={handleChartPrev} disabled={chartPrevDisabled} title={lbl.ttOlder}>&#8592;</button>
                                    <button class="chart-nav-btn" onclick={handleChartNext} disabled={chartNextDisabled} title={lbl.ttNewer}>&#8594;</button>
                                </span>
                            </h4>
                            <div class="wk-legend">
                                <span><i class="wk-sw"></i>{lbl.wkCreated}</span>
                                <span><i class="wk-sw wk-sw--closed"></i>{lbl.wkClosed}</span>
                            </div>
                            <template if:true={hasWeekly}>
                                <div class="wk-chart">
                                    <template for:each={weeklyList} for:item="w">
                                        <div key={w.key} class={w.colClass}>
                                            <div class="wk-b" title={w.createdTitle}>
                                                <span class="wk-amt">{w.created}</span>
                                                <i class="wk-bar" style={w.createdStyle}></i>
                                            </div>
                                            <div class="wk-b" title={w.closedTitle}>
                                                <span class="wk-amt">{w.closed}</span>
                                                <i class="wk-bar wk-bar--closed" style={w.closedStyle}></i>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                                <div class="wk-x">
                                    <template for:each={weeklyList} for:item="w">
                                        <span key={w.key}>{w.label}</span>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <!-- Auto-match + this week -->
                        <div class="dash-stack">
                            <div class="card2">
                                <h4>{lbl.dashAutoMatch}</h4>
                                <div class="match">
                                    <b class="match__pct">{matchRatePct}%</b>
                                    <span class="match__sub">{matchRateSub}</span>
                                </div>
                                <div class="meter"><i style={matchMeterStyle}></i></div>
                            </div>
                            <div class="card2">
                                <h4>{lbl.wkThisWeek}</h4>
                                <div class="wk-sum">
                                    <div><span>{lbl.wkCreated}</span><b>{thisWeek.created}</b><small>{thisWeek.prevCreated}</small></div>
                                    <div><span>{lbl.wkClosed}</span><b class="wk-sum__closed">{thisWeek.closed}</b><small>{thisWeek.prevClosed}</small></div>
                                    <div><span>{lbl.wkStillOpen}</span><b>{stillOpenCount}</b></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Recent resolutions -->
                    <div class="card2">
                        <h4>{lbl.dashRecentRes}</h4>
                        <template if:true={hasRecentResolutions}>
                            <div class="ltable-wrap">
                                <table class="ltable">
                                    <thead>
                                        <tr>
                                            <th>{lbl.colTicket}</th>
                                            <th>{lbl.colDonor}</th>
                                            <th class="r">{lbl.colAmount}</th>
                                            <th>{lbl.colSource}</th>
                                            <th>{lbl.colOn}</th>
                                            <th>{lbl.colBy}</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={recentResolutionsList} for:item="r">
                                            <tr key={r.Id}>
                                                <td>
                                                    <button class="lt-link" data-ticket-id={r.Id} data-donor-name={r.donorDisplayName} data-ticket-name={r.ticketName} onclick={handleOpenResolutionTicket}>{r.ticketName}</button>
                                                </td>
                                                <td>
                                                    <template if:true={r.hasAccountLink}>
                                                        <a href={r.accountUrl} target="_blank" class="lt-donor-link">{r.donorDisplayName}</a>
                                                    </template>
                                                    <template if:false={r.hasAccountLink}>
                                                        {r.donorDisplayName}
                                                    </template>
                                                </td>
                                                <td class="r">{r.amountDisplay}</td>
                                                <td><span class={r.sourceClass} title={r.statusLabel}>{r.sourceLabel}</span></td>
                                                <td class="lt-muted">{r.resolvedAtDisplay}</td>
                                                <td class="lt-muted">{r.resolvedByName}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                        <template if:false={hasRecentResolutions}>
                            <div class="empty-list">{lbl.noRecentRes}</div>
                        </template>
                    </div>
                </div>
            </template>

            <!-- ── DONATION HISTORY TAB ──────────────────────────────────── -->
            <template if:true={isRightTabHistory}>
                <div class="rp-content audit-panel">

                    <div class="logs-switch" role="group">
                        <button class={logsHistoryBtnClass} data-tab="history" onclick={handleRightTabChange}>{lbl.tabHistory}</button>
                        <button class={logsAuditBtnClass} data-tab="audit" onclick={handleRightTabChange}>{lbl.tabAudit}</button>
                    </div>

                    <div class="audit-header">
                        <h3 class="audit-header__title">{lbl.histTitle}</h3>
                        <span class="audit-header__sub">{lbl.histSub}</span>
                        <button class="icon-btn" onclick={handleRefreshHistory} title={lbl.ttRefresh}>
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                        </button>
                    </div>

                    <template if:true={isLoadingHistory}>
                        <div class="loading-container">
                            <lightning-spinner size="medium" alternative-text={lbl.loading}></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isLoadingHistory}>

                        <!-- Search bar -->
                        <div class="tab-search-bar">
                            <lightning-icon icon-name="utility:search" size="xx-small" class="tab-search-icon"></lightning-icon>
                            <input type="search" class="tab-search-input"
                                   placeholder={lbl.histSearch}
                                   value={historySearchTerm}
                                   oninput={handleHistorySearchInput} />
                            <template if:true={historySearchTerm}>
                                <button class="tab-search-clear" onclick={handleHistoryClearSearch} title={lbl.ttClearSearch}>✕</button>
                            </template>
                        </div>

                        <template if:true={hasHistory}>
                            <div class="audit-table-wrapper">
                                <table class="ltable audit-table" data-table="history">
                                    <colgroup>
                                        <col><col><col><col><col><col><col><col>
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th>{lbl.colGiftNum}<span class="col-resizer" data-table="history" data-col="0" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colTicket}<span class="col-resizer" data-table="history" data-col="1" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colDonor}<span class="col-resizer" data-table="history" data-col="2" onmousedown={handleColResizeStart}></span></th>
                                            <th class="r">{lbl.colAmount}<span class="col-resizer" data-table="history" data-col="3" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colDate}<span class="col-resizer" data-table="history" data-col="4" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colSource}<span class="col-resizer" data-table="history" data-col="5" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colPayment}<span class="col-resizer" data-table="history" data-col="6" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colZeffyTx}<span class="col-resizer" data-table="history" data-col="7" onmousedown={handleColResizeStart}></span></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={pagedHistoryList} for:item="row">
                                            <tr key={row.Id} class={row.rowClass}>
                                                <td class="lt-mono">{row.Name}</td>
                                                <td>
                                                    <template if:true={row.hasTicket}>
                                                        <button class="lt-link"
                                                                data-id={row.TicketId}
                                                                data-name={row.TicketName}
                                                                data-donor={row.DonorName}
                                                                onclick={handleHistoryOpenTicket}
                                                                title={lbl.ttOpenTicket}>
                                                            {row.TicketName}
                                                        </button>
                                                    </template>
                                                    <template if:false={row.hasTicket}><span class="lt-muted">—</span></template>
                                                </td>
                                                <td>{row.DonorName}</td>
                                                <td class="r history-td--amount">{row.amountDisplay}</td>
                                                <td class="lt-muted">{row.TransactionDate}</td>
                                                <td><span class={row.sourceClass} title={row.undoneTip}>{row.sourceLabel}</span></td>
                                                <td class="lt-muted">{row.PaymentMethod}</td>
                                                <td class="lt-mono">{row.ZeffyTransactionId}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="tab-footer-row">
                                <span class="audit-count">{historyPageInfo}</span>
                                <template if:true={historyShowPagination}>
                                    <div class="pagination">
                                        <button class="pag-btn" disabled={historyPrevDisabled} onclick={handleHistoryPrevPage}>{lbl.pagPrev}</button>
                                        <button class="pag-btn" disabled={historyNextDisabled} onclick={handleHistoryNextPage}>{lbl.pagNext}</button>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasHistory}>
                            <div class="empty-list">{lbl.noDonations}</div>
                        </template>
                    </template>

                </div>
            </template>

            <!-- ── MY TASKS TAB ───────────────────────────────────────────── -->
            <template if:true={isRightTabMyTasks}>
                <div class="rp-content mytasks-panel">
                    <div class="audit-header">
                        <div>
                            <div class="audit-header__title">{lbl.myTasksTitle}</div>
                            <div class="audit-header__sub">{lbl.myTasksSub}</div>
                        </div>
                        <button class="icon-btn" onclick={loadMyTasks} title={lbl.ttRefresh}>
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                        </button>
                    </div>

                    <template if:true={isMyTasksLoading}>
                        <div class="loading-container">
                            <lightning-spinner size="medium" alternative-text={lbl.loading}></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isMyTasksLoading}>
                        <template if:true={myTasks.length}>
                            <div class="mytasks-list">
                                <template for:each={myTasks} for:item="task">
                                    <button key={task.id}
                                            class="mytask-row"
                                            data-ticketid={task.ticketId}
                                            onclick={handleTaskClick}>
                                        <div class="mytask-row__left">
                                            <div class="mytask-row__subject">{task.subject}</div>
                                            <div class="mytask-row__ticket">{task.ticketName}</div>
                                            <template if:true={task.description}>
                                                <div class="mytask-row__desc">{task.description}</div>
                                            </template>
                                        </div>
                                        <div class="mytask-row__right">
                                            <template if:true={task.dueDate}>
                                                <span class="mytask-row__due">{lbl.due} {task.dueDate}</span>
                                            </template>
                                            <span class="mytask-row__priority">{task.priority}</span>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template if:false={myTasks.length}>
                            <div class="empty-state">
                                <lightning-icon icon-name="utility:check" size="large" class="empty-state__icon"></lightning-icon>
                                <div class="empty-state__title">{lbl.allCaughtUp}</div>
                                <div class="empty-state__sub">{lbl.noTasks}</div>
                            </div>
                        </template>
                    </template>
                </div>
            </template>

            <!-- ── TICKET TABS (workspace cejas) ─────────────────────────── -->
            <template if:true={isRightTabTicket}>
                <div class="rp-content detail-panel">

                    <template if:true={isLoadingDetail}>
                        <div class="loading-container">
                            <lightning-spinner size="medium" alternative-text={lbl.loading}></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isLoadingDetail}>
                        <template if:true={ticket}>

                            <!-- ═══════════════════════════════════════════════
                                 PENDING REVIEW — donor profile + 3 action buttons + modals
                            ═══════════════════════════════════════════════ -->
                            <template if:true={isPending}>

                                <!-- ── Static header: ticket ID + date ───── -->
                                <div class="tkt-static-header">
                                    <div class="tkt-static-header__row">
                                        <div class="tkt-static-header__left">
                                            <span class="tkt-ticket-num">{ticket.Name}</span>
                                            <span class={ticketStatusBadgeClass}>{ticketStatusLabel}</span>
                                            <template if:true={ticket.Manual_Assignee_Name__c}>
                                                <span class="assignee-badge">
                                                    <lightning-icon icon-name="utility:user" size="xx-small"></lightning-icon>
                                                    {ticket.Manual_Assignee_Name__c}
                                                </span>
                                            </template>
                                        </div>
                                        <span class="tkt-gift-date">{ticketGiftDateDisplay}</span>
                                    </div>
                                    <template if:true={ticket.Error_Message__c}>
                                        <div class="error-banner">{ticket.Error_Message__c}</div>
                                    </template>
                                    <template if:true={ticket.Resolution_Notes__c}>
                                        <div class="reviewer-notes">
                                            <span class="reviewer-notes__label">{lbl.reviewerNotes}</span>
                                            <span class="reviewer-notes__text">{ticket.Resolution_Notes__c}</span>
                                        </div>
                                    </template>
                                </div>

                                <!-- ── Scrollable body: donor profile ─────── -->
                                <div class="tkt-body-scroll">

                                    <!-- Donor profile card -->
                                    <div class="donor-profile-card">
                                        <div class="donor-profile-card__name"><span class="dpc-kind">{donorCardKind}</span>{donorCardTitle}</div>
                                        <div class="donor-profile-card__amount">{ticketAmountDisplay}</div>
                                        <template if:true={hasPaymentAlerts}>
                                            <div class="pay-chips">
                                                <template for:each={paymentAlertChips} for:item="c">
                                                    <span key={c.key} class={c.cls}>{c.text}</span>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={amountNeedsReview}>
                                            <div class="amount-fix-note">
                                                <div class="amount-fix-note__text">
                                                    <span class="amount-fix-note__title">⚠ {lbl.amtReviewTitle}</span>
                                                    <span class="amount-fix-note__body">{amountReviewBody}</span>
                                                </div>
                                                <button class="amount-fix-note__btn" onclick={handleMarkAmountReviewed} disabled={isMarkingAmountReviewed}>{lbl.btnAmtReviewed}</button>
                                            </div>
                                        </template>
                                        <div class="donor-profile-card__rows">
                                            <template if:true={ticket.Form_Name__c}>
                                                <div class="dpr" title={lbl.fldCampaign}>
                                                    <span class="dpr__icon">📣</span>
                                                    <span class="dpr__val dpr__val--strong">{ticket.Form_Name__c}</span>
                                                </div>
                                            </template>
                                            <template if:true={donorCardOrigin}>
                                                <div class="dpr" title={lbl.fldOrigin}>
                                                    <span class="dpr__icon">{donorCardOrigin.icon}</span>
                                                    <span class="dpr__val"><span class={donorCardOrigin.pillClass}>{donorCardOrigin.label}</span><span class="dpr__hint">{donorCardOrigin.hint}</span></span>
                                                </div>
                                            </template>
                                            <template if:true={donorCardContact}>
                                                <div class="dpr" title={lbl.fldContactPerson}>
                                                    <span class="dpr__icon">👤</span>
                                                    <span class="dpr__val"><span class="dpr__key">{lbl.cardContact}</span>{donorCardContact}</span>
                                                </div>
                                            </template>
                                            <template if:true={ticket.Email__c}>
                                                <div class="dpr">
                                                    <span class="dpr__icon">✉</span>
                                                    <span class="dpr__val">{ticket.Email__c}</span>
                                                </div>
                                            </template>
                                            <template if:true={ticket.Phone__c}>
                                                <div class="dpr">
                                                    <span class="dpr__icon">☎</span>
                                                    <span class="dpr__val">{ticket.Phone__c}</span>
                                                </div>
                                            </template>
                                            <template if:true={hasZeffyAddress}>
                                                <div class="dpr">
                                                    <span class="dpr__icon">📍</span>
                                                    <span class="dpr__val">{zeffyAddressDisplay}</span>
                                                </div>
                                            </template>
                                            <template if:true={ticket.Language__c}>
                                                <div class="dpr">
                                                    <span class="dpr__icon">🌐</span>
                                                    <span class="dpr__val">{ticket.Language__c}</span>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- All details: collapsed by default, blue card stays visible -->
                                    <button class="details-toggle" onclick={handleToggleAllDetails} aria-expanded={detailsAriaExpanded}>
                                        <span class="details-toggle__label">{detailsToggleLabel}</span>
                                        <span class={detailsChevronClass}></span>
                                    </button>
                                    <template if:true={showAllDetails}>
                                    <!-- Full donor info grid -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secDonorDetails}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldFirstName}</span>
                                                <span class="info-value">{ticket.First_Name__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldLastName}</span>
                                                <span class="info-value">{ticket.Last_Name__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCompany}</span>
                                                <span class="info-value">{ticket.Company_Name__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldEmail}</span>
                                                <span class="info-value">{ticket.Email__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldPhone}</span>
                                                <span class="info-value">{ticket.Phone__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldLanguage}</span>
                                                <span class="info-value">{ticket.Language__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldAddress}</span>
                                                <span class="info-value">{ticket.Address__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCity}</span>
                                                <span class="info-value">{ticket.City__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldProvince}</span>
                                                <span class="info-value">{ticket.Province__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldPostalCode}</span>
                                                <span class="info-value">{ticket.Postal_Code__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCountry}</span>
                                                <span class="info-value">{ticket.Country__c}</span>
                                            </div>
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldZeffyContactId}</span>
                                                <span class="info-value info-value--mono">{ticket.Zeffy_Contact_Id__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Gift details -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secGiftDetails}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldAmount}</span>
                                                <span class="info-value">{ticketAmountDisplay}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldEligibleAmount}</span>
                                                <span class="info-value">{ticketEligibleDisplay}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldPaymentMethod}</span>
                                                <span class="info-value">{ticket.Payment_Method__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldGiftDate}</span>
                                                <span class="info-value">{ticketGiftDateDisplay}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldIsRecurring}</span>
                                                <span class="info-value">{isRecurringLabel}</span>
                                            </div>
                                            <template if:true={ticket.Zeffy_Transaction_Id__c}>
                                                <div class="info-cell">
                                                    <span class="info-label">{lbl.fldTxStatus}</span>
                                                    <span class="info-value">
                                                        <span class="tx-status-chip">{txStatusLabel}</span>
                                                        <button class="timeline-btn"
                                                            data-txid={ticket.Zeffy_Transaction_Id__c}
                                                            data-name={ticket.Name}
                                                            onclick={handleOpenTimeline}
                                                            title={lbl.ttTimeline}>🕐</button>
                                                    </span>
                                                </div>
                                            </template>
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldFormName}</span>
                                                <span class="info-value">{ticket.Form_Name__c}</span>
                                            </div>
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldTransactionId}</span>
                                                <span class="info-value info-value--mono">{ticket.Zeffy_Transaction_Id__c}</span>
                                            </div>
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldFund}</span>
                                                <span class="info-value">{ticketFundLabel}</span>
                                            </div>
                                            <template if:true={ticket.Receipt_URL__c}>
                                                <div class="info-cell info-cell--full">
                                                    <span class="info-label">{lbl.fldZeffyReceipt}</span>
                                                    <a href={ticket.Receipt_URL__c} target="_blank" rel="noopener noreferrer"
                                                       class="info-value info-link">
                                                        {lbl.viewReceipt}
                                                    </a>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <!-- Card Details -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secCardDetails}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCardBrand}</span>
                                                <span class="info-value">{ticket.Card_Brand__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldLast4}</span>
                                                <span class="info-value info-value--mono">{ticket.Card_Last4__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Fund -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secFund}</div>
                                        <div class="info-grid">
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldFundName}</span>
                                                <span class="info-value">{ticket.Fund_Name__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldFundCode}</span>
                                                <span class="info-value">{ticket.Fund_Code__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldFundId}</span>
                                                <span class="info-value info-value--mono">{ticket.Fund_Id__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Campaign & Donor Type -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secCampaign}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCategory}</span>
                                                <span class="info-value">{ticket.Campaign_Category__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCorporateDonor}</span>
                                                <span class="info-value">{isCorporateLabel}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Tribute -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secTribute}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldTributeType}</span>
                                                <span class="info-value">{tributeTypeLabel}</span>
                                            </div>
                                            <div class="info-cell info-cell--full">
                                                <span class="info-label">{lbl.fldInHonourOf}</span>
                                                <span class="info-value">{ticket.Tribute_Honouree__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Dispute -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secDispute}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldStatus}</span>
                                                <span class="info-value">{disputeStatusLabel}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldReason}</span>
                                                <span class="info-value">{disputeReasonLabel}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldAmount}</span>
                                                <span class="info-value">{ticket.Dispute_Amount__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Refund -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secRefund}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldStatus}</span>
                                                <span class="info-value">{refundStatusLabel}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldAmount}</span>
                                                <span class="info-value">{ticket.Refund_Amount__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Discount -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secDiscount}</div>
                                        <div class="info-grid">
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldCode}</span>
                                                <span class="info-value">{ticket.Discount_Code__c}</span>
                                            </div>
                                            <div class="info-cell">
                                                <span class="info-label">{lbl.fldAmount}</span>
                                                <span class="info-value">{ticket.Discount_Amount__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Buyer Questions -->
                                    <div class="info-section">
                                        <div class="info-section__title">{lbl.secBuyerQuestions}</div>
                                        <div class="info-grid">
                                            <div class="info-cell info-cell--full">
                                                <span class="info-value">{ticket.Buyer_Questions__c}</span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Zeffy Notes -->
                                    <template if:true={hasNoteOrAnnotation}>
                                        <div class="info-section">
                                            <div class="info-section__title">{lbl.secZeffyNotes}</div>
                                            <div class="info-grid">
                                                <template if:true={ticket.Note__c}>
                                                    <div class="info-cell info-cell--full">
                                                        <span class="info-label">{lbl.fldNote}</span>
                                                        <span class="info-value">{ticket.Note__c}</span>
                                                    </div>
                                                </template>
                                                <template if:true={ticket.Annotation__c}>
                                                    <div class="info-cell info-cell--full">
                                                        <span class="info-label">{lbl.fldAnnotation}</span>
                                                        <span class="info-value">{ticket.Annotation__c}</span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                    </template>

                                </div><!-- end tkt-body-scroll -->

                                <!-- ── Static footer: 3 action buttons ────── -->
                                <div class="tkt-static-footer">
                                    <button class="act-btn act-btn--exception" onclick={handleOpenExceptionModal}>
                                        <lightning-icon icon-name="utility:warning" size="x-small"></lightning-icon>
                                        {lbl.btnException}
                                    </button>
                                    <template if:true={showFollowupButton}>
                                        <button class="act-btn act-btn--assign" onclick={handleOpenAssignModal}>
                                            <lightning-icon icon-name="utility:adduser" size="x-small"></lightning-icon>
                                            {followupLabel}
                                        </button>
                                    </template>
                                    <div class="act-btn-group">
                                        <template if:true={canReturnToWaiting}>
                                            <button class="act-btn act-btn--back" onclick={handleReturnToWaiting}>
                                                <lightning-icon icon-name="utility:back" size="x-small"></lightning-icon>
                                                {returnToWaitingLabel}
                                            </button>
                                        </template>
                                        <button class="act-btn act-btn--matches" onclick={handleOpenMatchesModal}>
                                            {lbl.btnViewMatches}
                                            <lightning-icon icon-name="utility:forward" size="x-small"></lightning-icon>
                                        </button>
                                    </div>
                                </div>

                                <!-- ══ MODAL: VIEW MATCHES WIZARD ══════════════════════ -->
                                <template if:true={showMatchesModal}>
                                    <div class="modal-overlay modal-overlay--top">
                                        <div class="wiz-dialog">

                                            <!-- Wizard header -->
                                            <div class="wiz-header">
                                                <span class="wiz-header__title">{lbl.wizTitle}</span>
                                                <button class="sm-close-btn" onclick={handleCloseMatchesModal} title={lbl.ttClose}>
                                                    <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                                </button>
                                            </div>

                                            <!-- Step indicator -->
                                            <div class="wiz-steps">
                                                <div class={wizardStep1Class}>
                                                    <span class="wiz-step__num">1</span>
                                                    <span class="wiz-step__label">{lbl.wizStep1}</span>
                                                </div>
                                                <div class="wiz-step-line"></div>
                                                <div class={wizardStep2Class}>
                                                    <span class="wiz-step__num">2</span>
                                                    <span class="wiz-step__label">{lbl.wizStep2}</span>
                                                </div>
                                            </div>

                                            <!-- ── Step 1: candidates + create ─── -->
                                            <template if:true={isWizardStep1}>
                                                <div class="wiz-body">
                                                    <p class="wiz-body__hint">{lbl.wizHint}</p>

                                                    <!-- Mode chooser: only the chosen path is shown below -->
                                                    <div class="wiz-mode-row" role="radiogroup" aria-label={lbl.wizHint}>
                                                        <button class={wizModeLinkClass} data-mode="link" role="radio"
                                                                aria-checked={isWizardLinkModeStr} onclick={handleWizardModeChange}>
                                                            <span class="wiz-mode-card__icon">
                                                                <lightning-icon icon-name="utility:link" size="small"></lightning-icon>
                                                            </span>
                                                            <span class="wiz-mode-card__text">
                                                                <span class="wiz-mode-card__title">{lbl.wizModeLink}</span>
                                                                <span class="wiz-mode-card__desc">{lbl.wizModeLinkDesc}</span>
                                                            </span>
                                                            <span class="wiz-mode-card__radio"></span>
                                                        </button>
                                                        <button class={wizModeCreateClass} data-mode="create" role="radio"
                                                                aria-checked={isWizardCreateModeStr} onclick={handleWizardModeChange}>
                                                            <span class="wiz-mode-card__icon">
                                                                <lightning-icon icon-name="utility:add" size="small"></lightning-icon>
                                                            </span>
                                                            <span class="wiz-mode-card__text">
                                                                <span class="wiz-mode-card__title">{lbl.wizModeCreate}</span>
                                                                <span class="wiz-mode-card__desc">{lbl.wizModeCreateDesc}</span>
                                                            </span>
                                                            <span class="wiz-mode-card__radio"></span>
                                                        </button>
                                                    </div>

                                                    <template if:true={isWizardLinkMode}>
                                                    <div class="candidates-section__header">
                                                        <div class="candidates-section__left">
                                                            <span class="candidates-section__title">{lbl.wizPossibleMatches}</span>
                                                            <span class="csh-donor-name">{ticketDonorName}</span>
                                                            <template if:true={ticket.Email__c}>
                                                                <span class="csh-donor-sep">·</span>
                                                                <span class="csh-donor-email">{ticket.Email__c}</span>
                                                            </template>
                                                        </div>
                                                        <template if:true={isLoadingMatches}>
                                                            <lightning-spinner size="x-small" alternative-text={lbl.loading}></lightning-spinner>
                                                        </template>
                                                    </div>

                                                    <template if:true={hasMatchCandidates}>
                                                        <div class="candidates-scroll-list">
                                                            <template for:each={candidateList} for:item="c">
                                                                <div key={c.id} class={c.cardClass} data-id={c.id} data-name={c.name} onclick={handleSelectCandidate}>
                                                                    <div class="candidate-card__top">
                                                                        <span class="candidate-card__name">{c.name}</span>
                                                                        <span class={c.badgeClass}>{c.scoreLabel}</span>
                                                                    </div>
                                                                    <div class="candidate-card__meta">
                                                                        <template if:true={c.email}>
                                                                            <span class="candidate-card__chip">{c.email}</span>
                                                                        </template>
                                                                        <template if:true={c.phone}>
                                                                            <span class="candidate-card__chip">{c.phone}</span>
                                                                        </template>
                                                                        <template if:true={c.city}>
                                                                            <span class="candidate-card__chip">{c.city}</span>
                                                                        </template>
                                                                    </div>
                                                                </div>
                                                            </template>
                                                        </div>
                                                    </template>
                                                    <template if:false={hasMatchCandidates}>
                                                        <template if:false={isLoadingMatches}>
                                                            <div class="no-candidates">{lbl.wizNoMatches}</div>
                                                        </template>
                                                    </template>

                                                    <!-- Manual search (name or email) -->
                                                    <div class="manual-search-row">
                                                        <lightning-record-picker
                                                            label={lbl.wizSearchSF}
                                                            placeholder={lbl.wizSearchPlaceholder}
                                                            object-api-name="Account"
                                                            value={selectedAccountId}
                                                            matching-info={accountMatchingInfo}
                                                            onchange={handleAccountSelected}>
                                                        </lightning-record-picker>
                                                    </div>

                                                    </template>

                                                    <!-- Create new: account type picker -->
                                                    <template if:true={isWizardCreateMode}>
                                                    <template if:true={duplicateWarning}>
                                                        <div class="dup-warning" role="alert">
                                                            <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon>
                                                            <div class="dup-warning__body">
                                                                <p class="dup-warning__title">{lbl.dupWarnTitle}</p>
                                                                <p>{duplicateWarning.body}</p>
                                                                <button class="dup-warning__btn" data-id={duplicateWarning.id} onclick={handleSelectCandidate}>{duplicateWarning.btn}</button>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <p class="wiz-section-title">{lbl.wizCreateTypeTitle}</p>
                                                    <div class="create-type-row">
                                                        <button class={createBtnClassIndividual} data-type="individual" onclick={handleSelectCreateMode}>
                                                            <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
                                                            {lbl.wizIndividual}
                                                        </button>
                                                        <button class={createBtnClassEglise} data-type="eglise" onclick={handleSelectCreateMode}>
                                                            <lightning-icon icon-name="utility:groups" size="small"></lightning-icon>
                                                            {lbl.wizChurch}
                                                        </button>
                                                        <button class={createBtnClassOrg} data-type="org" onclick={handleSelectCreateMode}>
                                                            <lightning-icon icon-name="utility:company" size="small"></lightning-icon>
                                                            {lbl.wizOrg}
                                                        </button>
                                                        <button class={createBtnClassBusiness} data-type="business" onclick={handleSelectCreateMode}>
                                                            <lightning-icon icon-name="utility:store" size="small"></lightning-icon>
                                                            {lbl.wizBusiness}

                                                                        <div class="rv-zval">

                                                                    </div>
                                                                    <div class="rv-mid rv-row"><span class={rvArrowAddrClass}><lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon></span></div>
                                                                    <div class="rv-sf rv-row">
                                                                        <span class="rv-field"><lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>{lbl.fldAddress}</span>
                                                                        <div class="rv-slots">
                                                                            <button type="button" class={rvAddrSlot.cls} role="switch" aria-checked={rvAddrSlot.checked} data-row="address" onclick={handleRvToggleRow} title={rvAddrSlot.title} disabled={rvAddrSlot.disabled}>

                                                                                    <span class="rv-sl">{lbl.rvAddrBilling}<template if:true={rvAddrSlot.tag}><span class="rv-tag rv-tag--inline">{rvAddrSlot.tag}</span></template></span>
                                                                                    <template if:true={rvAddrSlot.on}>

                                                                                        <span class="rv-newv">{rvAddrSlot.newVal}</span>
                                                                                    </template>
                                                                                    <template if:false={rvAddrSlot.on}><span class="rv-sv">{rvAddrSlot.display}</span></template>
                                                                                </span>
                                                                            </button>
                                                                        </div>
                                                                    </div>

                                                                <!-- closes the blue Salesforce panel -->

                                                            <!-- What happens on confirm -->

                                                                    </button>
