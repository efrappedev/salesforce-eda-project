                                        <button class="dup-warning__btn" data-id={bulkDuplicateWarning.id} data-name={bulkDuplicateWarning.name} onclick={handleBulkCandidateSelect}>{bulkDuplicateWarning.btn}</button>
                                    </div>
                                </div>
                            </template>
                            <p class="wiz-section-title">{lbl.wizCreateTypeTitle}</p>
                            <div class="create-type-row">
                                <button class={bulkCreateBtnClassIndividual} data-type="individual" onclick={handleBulkSelectCreateType}>
                                    <lightning-icon icon-name="utility:user" size="small"></lightning-icon>
                                    {lbl.wizIndividual}
                                </button>
                                <button class={bulkCreateBtnClassEglise} data-type="eglise" onclick={handleBulkSelectCreateType}>
                                    <lightning-icon icon-name="utility:groups" size="small"></lightning-icon>
                                    {lbl.wizChurch}
                                </button>
                                <button class={bulkCreateBtnClassOrg} data-type="org" onclick={handleBulkSelectCreateType}>
                                    <lightning-icon icon-name="utility:company" size="small"></lightning-icon>
                                    {lbl.wizOrg}
                                </button>
                                <button class={bulkCreateBtnClassBusiness} data-type="business" onclick={handleBulkSelectCreateType}>
                                    <lightning-icon icon-name="utility:store" size="small"></lightning-icon>
                                    {lbl.wizBusiness}
                                </button>
                            </div>
                        </template>
                    </div>

                    <div class="wiz-footer">
                        <button class="wiz-btn wiz-btn--cancel" onclick={handleCloseBulkModal} disabled={bulkResolving}>{lbl.btnCancel}</button>
                        <button class="wiz-btn wiz-btn--next" disabled={isBulkNextDisabled} onclick={handleBulkNext}>
                            {lbl.wizCheckDetails}
                            <lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon>
                        </button>
                    </div>
                </template>

                <!-- Step 2 – review & confirm (link: same review grid as a single ticket, for the whole group) -->
                <template if:true={isBulkStep2}>
                    <div class="wiz-body">
                        <template if:true={isBulkLinkMode}>
                            <template if:true={_bgLoading}>
                                <div class="loading-container">
                                    <lightning-spinner size="medium" alternative-text={lbl.loadingComparison}></lightning-spinner>
                                </div>
                            </template>
                            <template if:true={_bgPreview}>
                                <div class="rv-grid">
                                    <!-- Name -->
                                    <div class="rv-zf">
                                        <span class="rv-eyebrow">{lbl.rvFromZeffy}</span>
                                        <span class="rv-field rv-field--name"><lightning-icon icon-name="utility:user" size="xx-small"></lightning-icon>{lbl.fldName}<template if:true={bgNameDiffers}><span class="rv-chip rv-chip--diff">{lbl.rvNameKept}</span></template><template if:false={bgNameDiffers}><span class="rv-chip rv-chip--same">{lbl.rvAlreadyOnAccount}</span></template></span>
                                        <div class="rv-zval rv-zval--name"><span class="rv-who">{bgZeffyFullName}</span></div>
                                        <span class="rv-meta"><b class="rv-amt">{bgTotalDisplay}</b><span>· {bgMetaText}</span></span>
                                    </div>
                                    <div class="rv-mid"><span class={bgArrowNameClass}><lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon></span></div>
                                    <div class="rv-sf rv-sf--top">
                                        <span class="rv-eyebrow rv-eyebrow--sf"><lightning-icon icon-name="utility:salesforce1" size="xx-small"></lightning-icon>{lbl.rvSfAccount}</span>
                                        <div class="rv-slots rv-slots--name">
                                            <div class="rv-slot rv-slot--single rv-slot--locked rv-slot--same rv-slot--name">
                                                <span class="rv-radio"></span>
                                                <span class="rv-txt"><template if:false={bgNameDiffers}><span class="rv-tag">{lbl.rvTagSame}</span></template><span class="rv-sv">{_bgPreview.accountName}</span></span>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Emails: every distinct email of the group; pick one, then a slot -->
                                    <div class="rv-zf rv-row">
                                        <span class="rv-field"><lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>{lbl.rvEmails}
                                            <template if:true={bgEmailBadge}><span class={bgEmailBadge.cls}>{bgEmailBadge.label}</span></template>
                                        </span>
                                        <template if:true={bgShowEmails}>
                                            <div class="bg-opts" role="radiogroup" aria-label={lbl.rvEmails}>
                                                <template for:each={bgEmailRows} for:item="e">
                                                    <div key={e.key} class={e.cls}>
                                                        <template if:true={e.editing}>
                                                            <input type="email" class={e.inputCls} data-key={e.key} value={e.value} oninput={handleBgEmailInput} aria-label={lbl.fldEmail} />
                                                            <button type="button" class="cmp-pen cmp-pen--active" data-key={e.key} onclick={handleBgEmailPencil} title={lbl.wizDiscardEdit} aria-label={lbl.wizDiscardEdit}><lightning-icon icon-name="utility:undo" size="xx-small"></lightning-icon></button>
                                                        </template>
                                                        <template if:false={e.editing}>
                                                            <button type="button" class="bg-opt__pick" role="radio" aria-checked={e.checked} data-key={e.key} onclick={handleBgPickEmail} disabled={e.disabled}>
                                                                <span class="rv-radio"></span>
                                                                <span class="bg-opt__tx">{e.value}</span>
                                                                <template if:true={e.count}><span class="bg-opt__cnt">{e.count}</span></template>
                                                            </button>
                                                            <button type="button" class="cmp-pen" data-key={e.key} onclick={handleBgEmailPencil} title={lbl.wizEditValue} aria-label={lbl.wizEditValue}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon></button>
                                                        </template>
                                                        <template if:true={e.chip}><span class="bg-opt__note"><span class={e.chip.cls}>{e.chip.label}</span></span></template>
                                                        <template if:true={e.assigned}><span class="bg-opt__note bg-opt__note--to">{e.assigned}</span></template>
                                                        <template if:true={e.invalid}><span class="bg-opt__note rv-err">{lbl.wizInvalidEmail}</span></template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={bgShowEmails}><span class="rv-v">—</span></template>
                                        <template if:true={bgEmailHint}><span class="rv-hint">{bgEmailHint}</span></template>
                                    </div>
                                    <div class="rv-mid rv-row"><span class={bgArrowEmailClass}><lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon></span></div>
                                    <div class="rv-sf rv-row">
                                        <span class="rv-field"><lightning-icon icon-name="utility:email" size="xx-small"></lightning-icon>{lbl.rvEmails}</span>
                                        <template if:true={bgHasEmailFields}>
                                            <div class="rv-slots rv-slots--cols bg-slots" aria-label={lbl.rvEmails}>
                                                <template for:each={bgEmailSlots} for:item="s">
                                                    <button key={s.key} type="button" class={s.cls} aria-pressed={s.checked} data-key={s.key} onclick={handleBgEmailSlot} title={s.title} disabled={s.disabled}>
                                                        <span class="rv-radio"></span>
                                                        <span class="rv-txt">
                                                            <span class="rv-sl">{s.label}<template if:true={s.tag}><span class="rv-tag rv-tag--inline">{s.tag}</span></template></span>
                                                            <template if:true={s.on}>
                                                                <template if:true={s.current}><span class="rv-old">{s.current}</span></template>
                                                                <span class="rv-newv">{s.newVal}</span>
                                                            </template>
                                                            <template if:false={s.on}><span class={s.svClass}>{s.display}</span></template>
                                                        </span>
                                                    </button>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={bgHasEmailFields}><span class="rv-hint">{lbl.wizNoEmailFields}</span></template>
                                    </div>

                                    <!-- Address: choose the right one when the group brings several -->
                                    <template if:true={bgShowAddress}>
                                        <div class="rv-zf rv-row">
                                            <span class="rv-field"><lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>{lbl.fldAddress}<span class={bgAddrChip.cls}>{bgAddrChip.label}</span></span>
                                            <template if:true={_bgAddrEditing}>
                                                <div class="rv-zval">
                                                    <span class="rv-v">{bgZeffyAddr}</span>
                                                    <button type="button" class="cmp-pen cmp-pen--active" onclick={handleBgAddrPencil} title={lbl.wizDiscardEdit} aria-label={lbl.wizDiscardEdit}><lightning-icon icon-name="utility:undo" size="xx-small"></lightning-icon></button>
                                                </div>
                                                <div class="cmp-addr-grid rv-addr-grid">
                                                    <label class="cmp-addr-field cmp-addr-field--wide"><span>{lbl.wizStreet}</span><input type="text" class="cmp-edit" data-field="street" value={bgAddrEdit.street} oninput={handleBgAddrInput} /></label>
                                                    <label class="cmp-addr-field"><span>{lbl.fldCity}</span><input type="text" class="cmp-edit" data-field="city" value={bgAddrEdit.city} oninput={handleBgAddrInput} /></label>
                                                    <label class="cmp-addr-field"><span>{lbl.fldProvince}</span><input type="text" class="cmp-edit" data-field="province" value={bgAddrEdit.province} oninput={handleBgAddrInput} /></label>
                                                    <label class="cmp-addr-field"><span>{lbl.fldPostalCode}</span><input type="text" class="cmp-edit" data-field="postalCode" value={bgAddrEdit.postalCode} oninput={handleBgAddrInput} /></label>
                                                    <label class="cmp-addr-field"><span>{lbl.fldCountry}</span><input type="text" class="cmp-edit" data-field="country" value={bgAddrEdit.country} oninput={handleBgAddrInput} /></label>
                                                </div>
                                            </template>
                                            <template if:false={_bgAddrEditing}>
                                                <template if:true={bgAddrMulti}>
                                                    <div class="bg-opts" role="radiogroup" aria-label={lbl.fldAddress}>
                                                        <template for:each={bgAddrOptions} for:item="a">
                                                            <div key={a.key} class={a.cls}>
                                                                <button type="button" class="bg-opt__pick" role="radio" aria-checked={a.checked} data-key={a.key} onclick={handleBgPickAddr}>
                                                                    <span class="rv-radio"></span>
                                                                    <span class="bg-opt__tx">{a.text}</span>
                                                                    <template if:true={a.recent}><span class="bg-opt__rec">{lbl.bgRecent}</span></template>
                                                                    <span class="bg-opt__cnt">{a.count}</span>
                                                                </button>
                                                            </div>
                                                        </template>
                                                    </div>
                                                    <div class="rv-zval">
                                                        <span class="rv-hint bg-hint-inline">{lbl.bgPickAddr}</span>
                                                        <button type="button" class="cmp-pen" onclick={handleBgAddrPencil} title={lbl.wizEditValue} aria-label={lbl.wizEditValue}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon></button>
                                                    </div>
                                                </template>
                                                <template if:false={bgAddrMulti}>
                                                    <div class="rv-zval">
                                                        <span class="rv-v">{bgZeffyAddr}</span>
                                                        <button type="button" class="cmp-pen" onclick={handleBgAddrPencil} title={lbl.wizEditValue} aria-label={lbl.wizEditValue}><lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon></button>
                                                    </div>
                                                </template>
                                            </template>
                                            <template if:true={bgAddrHint}><span class="rv-hint">{bgAddrHint}</span></template>
                                        </div>
                                        <div class="rv-mid rv-row"><span class={bgArrowAddrClass}><lightning-icon icon-name="utility:forward" size="xx-small"></lightning-icon></span></div>
                                        <div class="rv-sf rv-row">
                                            <span class="rv-field"><lightning-icon icon-name="utility:location" size="xx-small"></lightning-icon>{lbl.fldAddress}</span>
                                            <div class="rv-slots">
                                                <button type="button" class={bgAddrSlot.cls} role="switch" aria-checked={bgAddrSlot.checked} onclick={handleBgToggleAddr} title={bgAddrSlot.title} disabled={bgAddrSlot.disabled}>
                                                    <span class="rv-radio"></span>
                                                    <span class="rv-txt">
                                                        <span class="rv-sl">{lbl.rvAddrBilling}<template if:true={bgAddrSlot.tag}><span class="rv-tag rv-tag--inline">{bgAddrSlot.tag}</span></template></span>
                                                        <template if:true={bgAddrSlot.on}>
                                                            <template if:true={bgAddrSlot.current}><span class="rv-old">{bgAddrSlot.current}</span></template>
                                                            <span class="rv-newv">{bgAddrSlot.newVal}</span>
                                                        </template>
                                                        <template if:false={bgAddrSlot.on}><span class="rv-sv">{bgAddrSlot.display}</span></template>
                                                    </span>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                    <div class="rv-end"></div><div class="rv-end"></div><div class="rv-sf rv-sf--bottom"></div>
                                </div>
                            </template>
                        </template>

                        <template if:true={isBulkCreateMode}>
                            <div class="bulk-confirm-account">
                                <lightning-icon icon-name="standard:account" size="small"></lightning-icon>
                                <span class="bulk-confirm-account__name">{bulkHeadName}</span>
                                <span class="badge-new">{lbl.btnCreate}</span>
                            </div>
                        </template>

                        <!-- What happens on confirm; the tickets fold into the first line -->
                        <div class="rv-result" aria-live="polite">
                            <p class="rv-result__title">{lbl.rvConfirmTitle}</p>
                            <ul class="rv-result__list">
                                <li class="rv-result__item rv-result__item--do">
                                    <span class="rv-result__ic"><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon></span>
                                    <span class="bg-rec">
                                        <span>{lbl.rvSumRecord}<b>{bgTicketsAmtText}</b>{lbl.rvSumOn}<b>{bgRecordAccount}</b></span>
                                        <button type="button" class="rv-link bg-toggle" aria-expanded={bgShowAmounts} onclick={handleBgToggleAmounts}>{bgAmountsToggleLabel}</button>
                                    </span>
                                </li>
                                <template if:true={bgRange}><li class="bg-range">{bgRange}</li></template>
                                <template if:true={bgShowAmounts}>
                                    <li class="bg-amounts">
                                        <template for:each={bgAmountRows} for:item="r">
                                            <div key={r.id} class="bg-amounts__row">
                                                <span class="bg-amounts__num">{r.name}</span>
                                                <span class="bg-amounts__date">{r.date}</span>
                                                <span class="bg-amounts__amt">{r.amount}</span>
                                            </div>
                                        </template>
                                    </li>
                                </template>
                                <template if:true={isBulkLinkMode}>
                                    <template for:each={bgSummary} for:item="it">
                                        <li key={it.key} class={it.cls}>
                                            <span class="rv-result__ic"><lightning-icon icon-name={it.icon} size="xx-small"></lightning-icon></span>
                                            <span>{it.pre}<b>{it.bold}</b>{it.mid}<b>{it.bold2}</b></span>
                                        </li>
                                    </template>
                                </template>
                            </ul>
                            <p class="rv-result__foot">{lbl.rvSumFoot}</p>
                        </div>

                        <template if:true={bgNotesOpen}>
                            <lightning-textarea
                                label={lbl.wizResolutionNotes}
                                value={_bulkNotes}
                                onchange={handleBulkNotesChange}
                                class="slds-m-top_small">
                            </lightning-textarea>
                        </template>
                        <template if:false={bgNotesOpen}>
                            <button type="button" class="rv-link slds-m-top_small" onclick={handleBgOpenNotes}>{lbl.rvAddNote}</button>
                        </template>
                    </div>

                    <div class="wiz-footer">
                        <button class="wiz-btn wiz-btn--back" onclick={handleBulkBack} disabled={bulkResolving}>
                            <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                            {lbl.btnBack}
                        </button>
                        <button class="wiz-btn wiz-btn--cancel" onclick={handleCloseBulkModal} disabled={bulkResolving}>{lbl.btnCancel}</button>
                        <button class="wiz-btn wiz-btn--confirm" disabled={isBulkConfirmDisabled} onclick={handleBulkConfirm}>
                            <template if:true={bulkResolving}>
                                <span role="status" aria-live="polite">{bulkProgressLabel}</span>
                            </template>
                            <template if:false={bulkResolving}>
                                <template if:true={isBulkLinkMode}>{bgLinkLabel}</template>
                                <template if:false={isBulkLinkMode}>{bulkConfirmLabel}</template>
                            </template>
                        </button>
                    </div>
                </template>

            </div>
        </div>
    </template>

</template>
