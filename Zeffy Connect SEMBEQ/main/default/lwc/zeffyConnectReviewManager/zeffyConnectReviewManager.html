                                                                        <lightning-icon icon-name="utility:undo" size="xx-small"></lightning-icon>

                                                                    </label>
                                                                    </template>
                                                                    <label class="cmp-addr-field">
                                                                        <span>{lbl.fldPhone}</span>
                                                                        <input type="text" class="cmp-edit" data-field="phone" value={createEdit.phone} oninput={handleCreateEditValue} />
                                                                    </label>
                                                                    <label class="cmp-addr-field cmp-addr-field--wide">

                                                                    <label class="cmp-addr-field">

                                <template if:false={canMoveToReview}>

                                        <div class="resolved-banner__row resolved-banner__row--zid">

                                    <template if:true={ticket.Resolved_At__c}>

                                            <span class="resolved-banner__label">{resolvedOnLabel}</span>
                                            <span>{ticketResolvedAtDisplay}</span>

                                    <template if:true={ticket.Resolved_By__r}>

                                                    </template>
                                                </div>

                                <template if:true={showCloseConfirm}>

                                        </div>
                                    </div>
                                </template>

                                <template if:true={raOpen}>
                                    <div class="modal-overlay">
                                        <div class="ra-modal" role="dialog" aria-modal="true" aria-label={lbl.raTitle}>

                                                </template>
                                            </div>

                                            <div class="ra-body">
                                                <template if:true={raLoadingPreview}>
                                                    <div class="ra-muted">{lbl.raLoading}</div>
                                                </template>
                                                <template if:true={raPreview}>

                                                <!-- Step 1: what moves -->
                                                <template if:true={raIsStep1}>
                                                    <div class="ra-idbox">
                                                        <span class="ra-eyebrow">{lbl.raIdEyebrow}</span>
                                                        <span class="ra-mono ra-idbox__id">{raPreview.zeffyId}</span>
                                                        <span>{lbl.raCurrently}<strong>{raFromName}</strong></span>
                                                    </div>
                                                    <div>
                                                        <span class="ra-eyebrow">{lbl.raMovesTogether}</span>
                                                        <div class="ra-counts">
                                                            <div class="ra-count"><span class="ra-count__n">{raGiftCountFmt}</span><span class="ra-count__l">{raGiftsLabel}</span></div>
                                                            <div class="ra-count"><span class="ra-count__n">{raRecurringFmt}</span><span class="ra-count__l">{lbl.raRecurring}</span></div>
                                                            <div class="ra-count"><span class="ra-count__n">{raTicketFmt}</span><span class="ra-count__l">{lbl.raTickets}</span></div>
                                                            <div class="ra-count"><span class="ra-count__n">{raRefundFmt}</span><span class="ra-count__l">{lbl.raRefunds}</span></div>
                                                        </div>
                                                    </div>
                                                    <div class="ra-stays">
                                                        <span class="ra-eyebrow">{raStaysTitle}</span>
                                                        <ul class="ra-stays__list">
                                                            <template for:each={raOtherIds} for:item="o">
                                                                <li key={o.key}><span class="ra-mono">{o.zeffyId}</span><span>{o.text}</span></li>
                                                            </template>
                                                            <template if:true={raHasManual}>
                                                                <li><span>{lbl.raManualGifts}</span><span>{raManualText}</span></li>
                                                            </template>
                                                            <template if:true={raNothingStays}>
                                                                <li><span>{lbl.raNothingStays}</span></li>
                                                            </template>
                                                        </ul>
                                                    </div>
                                                    <template if:true={raBlockedText}>
                                                        <div class="ra-callout">{raBlockedText}</div>
                                                    </template>
                                                </template>

                                                <!-- Step 2: correct account -->
                                                <template if:true={raIsStep2}>
                                                    <div class="ra-search">
                                                        <label class="ra-eyebrow" for="raSearch">{lbl.raSearchLabel}</label>
                                                        <input id="raSearch" class="ra-search__input" type="search" autocomplete="off"
                                                               value={raSearchTerm} placeholder={lbl.raSearchPh} oninput={handleRaSearch} />
                                                    </div>
                                                    <div class="ra-results">
                                                        <template for:each={raResultRows} for:item="r">
                                                            <button key={r.id} class={r.cls} type="button" data-id={r.id}
                                                                    disabled={r.disabled} onclick={handleRaPick}>
                                                                <span><strong>{r.name}</strong><br /><span class="ra-sub">{r.sub}</span></span>
                                                                <template if:true={r.isSame}><span class="ra-cur">{lbl.raCurrentAccount}</span></template>
                                                            </button>
                                                        </template>
                                                        <template if:true={raNoResults}>
                                                            <div class="ra-muted">{lbl.raNoResults}</div>
                                                        </template>
                                                    </div>
                                                    <template if:true={raChosen}>
                                                        <div class="ra-compare">
                                                            <div class="ra-side">
                                                                <span class="ra-eyebrow">{lbl.raFrom}</span>
                                                                <h3 class="ra-side__name">{raFrom.name}</h3>
                                                                <dl class="ra-side__dl">
                                                                    <dt>{lbl.raEmail}</dt><dd>{raFrom.email}</dd>
                                                                    <dt>{lbl.raAddress}</dt><dd>{raFrom.address}</dd>
                                                                    <dt>{lbl.raZeffyIds}</dt><dd>{raFrom.zeffyIds}</dd>
                                                                </dl>
                                                            </div>
                                                            <div class="ra-arrow" aria-hidden="true">→</div>

                                                                <span class="ra-eyebrow">{lbl.raTo}</span>

                                                                    <dd><span>{raChosen.email}</span><template if:true={raChosen.emailMatch}><span class="ra-same">{lbl.raSame}</span></template></dd>
                                                                    <dt>{lbl.raAddress}</dt>
                                                                    <dd><span>{raChosen.address}</span><template if:true={raChosen.addressMatch}><span class="ra-same">{lbl.raSame}</span></template></dd>
                                                                    <dt>{lbl.raZeffyIds}</dt><dd>{raChosen.zeffyIds}</dd>
                                                                </dl>
                                                            </div>
                                                        </div>
                                                        <template if:true={raHasMatch}>
                                                            <div class="ra-matchbox">
                                                                <ul class="ra-checks">

                                                                        <li class="ra-check ra-check--do"><span class="ra-check__ic"><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon></span><span>{lbl.raEmailMatch}</span></li>
                                                                    </template>
                                                                    <template if:true={raChosen.addressMatch}>
                                                                        <li class="ra-check ra-check--do"><span class="ra-check__ic"><lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon></span><span>{lbl.raAddrMatch}</span></li>
                                                                    </template>
                                                                </ul>
                                                            </div>
                                                        </template>
                                                    </template>
                                                </template>

                                                <!-- Step 3: confirm / run / done -->
                                                <template if:true={raShowConfirm}>

                                                        <div class="ra-side"><span class="ra-eyebrow">{lbl.raFrom}</span><h3 class="ra-side__name">{raFromName}</h3></div>

                                                    <template if:true={raShowBackground}>
                                                        <div class="ra-callout"><b>{lbl.raBgTitle}</b><span>{raBgBody}</span></div>
                                                    </template>
                                                    <template if:true={raError}>
                                                        <div class="ra-error">{raError}</div>

                                                        <span>{lbl.raAckPre}<strong>{raToName}</strong>{lbl.raAckPost}</span>

                                                <template if:true={raShowDone}>

                                                                    <tbody>
                                                                        <template for:each={raLogs} for:item="g">
                                                                            <tr key={g.key}><td>{g.action}</td><td>{g.record}</td><td class="ra-mono">{g.oldV}</td><td class="ra-mono">{g.newV}</td><td>{g.by}</td></tr>
                                                                        </template>
                                                                        <template if:true={raMoreRows}>
                                                                            <tr><td colspan="5" class="ra-muted">{raMoreRows}</td></tr>
                                                                        </template>
                                                                    </tbody>
                                                                </table>
                                                            </div>
                                                        </div>
                                                    </template>
                                                </template>
                                                </template>

                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- All details: collapsed by default, blue card stays visible -->
                                <button class="details-toggle" onclick={handleToggleAllDetails} aria-expanded={detailsAriaExpanded}>
                                    <span class="details-toggle__label">{detailsToggleLabel}</span>
                                    <span class={detailsChevronClass}></span>
                                </button>
                                <template if:true={showAllDetails}>
                                <!-- Donor Information -->
                                <div class="info-section">
                                    <div class="info-section__title">{donorSectionTitle}</div>

                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldFirstName}</span>
                                            <span class="info-value">{ticket.First_Name__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldLastName}</span>
                                            <span class="info-value">{ticket.Last_Name__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldCompany}</span>
                                            <span class="info-value">{ticket.Company_Name__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldEmail}</span>
                                            <span class="info-value">{ticket.Email__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldPhone}</span>

                                        <div class="info-cell">

                                            <span class="info-label">{lbl.fldAddress}</span>
                                            <span class="info-value">{ticket.Address__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldCity}</span>
                                            <span class="info-value">{ticket.City__c}</span>
                                        </div>
                                        <div class="info-cell">
                                            <span class="info-label">{lbl.fldProvince}</span>
                                            <span class="info-value">{ticket.Province__c}</span>
                                        </div>

            <!-- ── AUDIT LOG TAB ──────────────────────────────────────────── -->
            <template if:true={isRightTabAudit}>

                    <div class="logs-switch" role="group">

                        <h3 class="audit-header__title">{lbl.auditTitle}</h3>
                        <span class="audit-header__sub">{lbl.auditSub}</span>

                        </button>

                    <template if:false={isLoadingAudit}>

                                <button class="tab-search-clear" onclick={handleAuditClearSearch} title={lbl.ttClearSearch}>✕</button>
                            </template>
                        </div>

                            <div class="audit-table-wrapper">

                                        <col><col><col><col><col><col>
                                    </colgroup>
                                    <thead>
                                        <tr>
                                            <th>{lbl.colOn}<span class="col-resizer" data-table="audit" data-col="0" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colAction}<span class="col-resizer" data-table="audit" data-col="1" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colTicket}<span class="col-resizer" data-table="audit" data-col="2" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colAccount}<span class="col-resizer" data-table="audit" data-col="3" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colBy}<span class="col-resizer" data-table="audit" data-col="4" onmousedown={handleColResizeStart}></span></th>
                                            <th>{lbl.colNotes}<span class="col-resizer" data-table="audit" data-col="5" onmousedown={handleColResizeStart}></span></th>

                                                <td class="lt-muted" title={log.Name}>{log.performedAtDisplay}</td>
                                                <td class="lt-action">{log.actionLabel}</td>
                                                <td>
                                                    <template if:true={log.hasTicket}>
                                                        <button class="lt-link"
                                                                data-id={log.ticketId}
                                                                data-name={log.ticketName}
                                                                data-account={log.accountName}
                                                                onclick={handleAuditOpenTicket}
                                                                title={lbl.ttOpenTicket}>
                                                            {log.ticketName}
                                                        </button>
                                                    </template>
                                                    <template if:false={log.hasTicket}><span class="lt-muted">—</span></template>
                                                </td>
                                                <td>{log.accountName}</td>
                                                <td class="lt-muted">{log.performedByName}</td>
                                                <td class={log.notesClass} title={log.Notes__c}>{log.Notes__c}</td>
                                            </tr>
                                        </template>

                                </table>

                                <template if:true={auditShowPagination}>

                                    </div>
                                </template>

                                {lbl.navImport}

                                                <lightning-icon icon-name="utility:upload" size="small" class="import-drop-zone__icon"></lightning-icon>
                                                <span class="import-drop-zone__text">{lbl.importClickToSelect}</span>
                                                <input type="file" accept=".csv" class="import-file-input" onchange={handleImportFileChange} />
                                            </label>
                                        </template>

                                        <!-- File loaded — ready to import -->
                                        <template if:true={importHasRows}>
                                            <div class="import-file-ready">
                                                <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                                <span class="import-file-ready__name">{importFileName}</span>
                                                <span class="import-file-ready__count">{importRows.length} {lbl.importRowsWord}</span>
                                                <button class="import-file-clear" onclick={handleClearImport} title={lbl.ttRemove}>✕</button>
                                            </div>

                                            <!-- Progress bar (while importing) -->
                                            <template if:true={isImporting}>
                                                <div class="import-progress-wrap">
                                                    <div class="import-progress-bar">
                                                        <div class="import-progress-fill" style={importProgressStyle}></div>
                                                    </div>
                                                    <span class="import-progress-label">{importDone} / {importTotal} {lbl.importingProgress}</span>
                                                </div>
                                            </template>

                                            <!-- Results (after import) -->
                                            <template if:true={importComplete}>
                                                <div class="import-results">
                                                    <div class="import-results__row import-results__row--ok">
                                                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                        {importDone} {lbl.ticketsCreated}
                                                    </div>
                                                    <template if:true={importSkipped}>
                                                        <div class="import-results__row import-results__row--skip">
                                                            <lightning-icon icon-name="utility:skip" size="xx-small"></lightning-icon>
                                                            {importSkipped} {lbl.duplicatesSkipped}
                                                        </div>
                                                    </template>
                                                    <template if:true={importHasErrors}>
                                                        <div class="import-results__row import-results__row--err">
                                                            <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                                                            {importErrors.length} {lbl.errorsCount}
                                                        </div>
                                                        <template for:each={importErrors} for:item="err">
                                                            <div key={err} class="import-error-item">{err}</div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Import button -->
                                            <template if:false={importComplete}>
                                                <button class="import-start-btn" disabled={isImporting} onclick={handleStartImport}>
                                                    <lightning-icon icon-name="utility:upload" size="xx-small"></lightning-icon>
                                                    {importBtnLabel}
                                                </button>
                                            </template>
                                            <template if:true={importComplete}>
                                                <button class="import-template-btn" onclick={handleClearImport}>
                                                    {lbl.btnImportAnother}
                                                </button>
                                            </template>
                                        </template>

                                    </div>
                                </template>

                                <!-- ── Event Processing ──────────────────────── -->
                                <template if:true={isSettingsEvents}>
                                    <div class="sm-section-title">{lbl.eventsTitle}</div>
                                    <div class="sm-section-body">
                                        <p class="sm-section-desc">{lbl.eventsDesc}</p>

                                        <lightning-input type="toggle" label={lbl.evtCompletedLabel}
                                            checked disabled message-toggle-active={lbl.evtCompletedAlwaysOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle sm-toggle--disabled"></lightning-input>

                                        <lightning-input type="toggle" label={lbl.evtCreatedLabel}
                                            checked={evtPaymentCreated}
                                            onchange={handleEvtPaymentCreatedToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.evtCreatedHint}</p>

                                        <lightning-input type="toggle" label={lbl.evtUpdatedLabel}
                                            checked={evtPaymentUpdated}
                                            onchange={handleEvtPaymentUpdatedToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.evtUpdatedHint}</p>

                                        <lightning-input type="toggle" label={lbl.evtDeletedLabel}
                                            checked={evtPaymentDeleted}
                                            onchange={handleEvtPaymentDeletedToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.evtDeletedHint}</p>

                                        <lightning-input type="toggle" label={lbl.evtContactLabel}
                                            checked={evtContactEvents}
                                            onchange={handleEvtContactEventsToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.evtContactHint}</p>

                                        <div class="sm-section-separator"></div>

                                        <lightning-input type="toggle" label={lbl.evtHoldingExpireLabel}
                                            checked={evtHoldingExpireEnabled}
                                            onchange={handleEvtHoldingExpireToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.evtHoldingExpireHint}</p>
                                        <template if:true={evtHoldingExpireEnabled}>
                                            <lightning-input type="number" label={lbl.evtHoldingExpireDaysLabel}
                                                value={evtHoldingExpireDays}
                                                min="1" max="365"
                                                onchange={handleEvtHoldingExpireDaysChange}
                                                class="sm-input-narrow">
                                            </lightning-input>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── Ticket Actions (admin only) ────────────── -->
                                <template if:true={isSettingsTicketActions}>
                                    <div class="sm-section-title">{lbl.ticketActionsTitle}</div>
                                    <div class="sm-section-body">
                                        <p class="sm-section-desc">{lbl.ticketActionsDesc}</p>
                                        <lightning-input type="toggle" label={lbl.showFollowupLabel}
                                            checked={showFollowupSetting}
                                            onchange={handleShowFollowupToggle}
                                            message-toggle-active={lbl.evtOn} message-toggle-inactive={lbl.evtOff}
                                            class="sm-toggle"></lightning-input>
                                        <p class="sm-toggle-hint">{lbl.showFollowupHint}</p>
                                        <lightning-button variant="brand" label={saveTicketActionsBtnLabel}
                                            disabled={isSavingTicketActions}
                                            onclick={handleSaveTicketActions}></lightning-button>
                                    </div>
                                </template>

                                <!-- ── Zeffy Credentials (admin only) ─────────── -->
                                <template if:true={isSettingsCreds}>
                                    <div class="sm-section-title">{lbl.credSection}</div>
                                    <div class="sm-section-body">
                                        <lightning-input
                                            type="checkbox"
                                            label={lbl.credActive}
                                            checked={settingsIsActive}
                                            onchange={handleSettingsActiveChange}>
                                        </lightning-input>
                                        <div class="settings-hint">{lbl.credHint}</div>
                                        <lightning-input
                                            type="password"
                                            label={lbl.credApiKey}
                                            placeholder={settingsApiKey}
                                            value={settingsApiKey}
                                            onchange={handleSettingsApiKeyChange}>
                                        </lightning-input>
                                        <lightning-input
                                            type="password"
                                            label={lbl.credSecret}
                                            placeholder={settingsSecret}
                                            value={settingsSecret}
                                            onchange={handleSettingsSecretChange}>
                                        </lightning-input>
                                        <lightning-input
                                            type="url"
                                            label={lbl.credWebhookUrl}
                                            value={settingsWebhookUrl}
                                            placeholder="https://…/ZeffyConnect/services/apexrest/zeffy-connect/webhook/receive"
                                            field-level-help={lbl.credWebhookUrlHint}
                                            onchange={handleSettingsWebhookUrlChange}>
                                        </lightning-input>
                                        <div class="settings-section--info">
                                            <div class="settings-section__title">{lbl.credInfo}</div>
                                            <ul class="settings-list">
                                                <li>{lbl.credInfoLine1}</li>
                                                <li>{lbl.credInfoLine2}</li>
                                            </ul>
                                        </div>
                                    </div>
                                </template>

                                <!-- ── Funds ─────────────────────────────────── -->
                                <template if:true={isSettingsFunds}>
                                    <div class="sm-section-title">{lbl.fundsTitle}</div>
                                    <div class="sm-section-body">
                                        <p class="sm-section-desc">{lbl.fundsDesc}</p>

                                        <!-- New Fund button / form -->
                                        <div class="fund-toolbar">
                                            <template if:false={showNewFundForm}>
                                                <lightning-button
                                                    label={lbl.fundsNewFund}
                                                    icon-name="utility:add"
                                                    onclick={handleToggleNewFundForm}>
                                                </lightning-button>
                                            </template>
                                            <template if:true={showNewFundForm}>
                                                <div class="fund-new-form">
                                                    <lightning-input
                                                        label={lbl.fundNamePlaceholder}
                                                        value={newFundName}
                                                        onchange={handleNewFundNameChange}
                                                        class="fund-new-name">
                                                    </lightning-input>
                                                    <lightning-input
                                                        label={lbl.fundDescPlaceholder}
                                                        value={newFundDesc}
                                                        onchange={handleNewFundDescChange}
                                                        class="fund-new-desc">
                                                    </lightning-input>
                                                    <div class="fund-new-actions">
                                                        <lightning-button
                                                            label={lbl.fundCreate}
                                                            variant="brand"
                                                            disabled={isSavingFund}
                                                            onclick={handleCreateFund}>
                                                        </lightning-button>
                                                        <lightning-button
                                                            label={lbl.fundCancel}
                                                            onclick={handleToggleNewFundForm}>
                                                        </lightning-button>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>

                                        <!-- Loading -->
                                        <template if:true={isLoadingFunds}>
                                            <div class="fund-loading-wrap">
                                                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                            </div>
                                        </template>

                                        <!-- Fund cards (skip index 0 = unassigned) + unassigned at bottom -->
                                        <template if:false={isLoadingFunds}>
                                            <template for:each={fundData} for:item="fr">
                                                <div key={fr.id} class="fund-card">
                                                    <template if:true={fr.id}>
                                                        <!-- Named fund -->
                                                        <div class="fund-card-header">
                                                            <span class="fund-card-name">{fr.name}</span>
                                                            <span class="fund-campaign-count">{fr.campaigns.length}</span>
                                                        </div>
                                                        <template if:true={fr.campaigns.length}>
                                                            <ul class="fund-campaign-list">
                                                                <template for:each={fr.campaigns} for:item="camp">
                                                                    <li key={camp.id} class="fund-campaign-row">
                                                                        <span class="fund-campaign-name">{camp.name}</span>
                                                                        <lightning-combobox
                                                                            label=""
                                                                            value={camp.fundId}
                                                                            options={fundMoveOptions}
                                                                            data-campaignid={camp.id}
                                                                            onchange={handleAssignCampaignToFund}
                                                                            variant="label-hidden"
                                                                            class="fund-move-combo">
                                                                        </lightning-combobox>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </template>
                                                        <template if:false={fr.campaigns.length}>
                                                            <p class="fund-empty">{lbl.fundNoCampaigns}</p>
                                                        </template>
                                                    </template>
                                                    <template if:false={fr.id}>
                                                        <!-- Unassigned bucket -->
                                                        <div class="fund-card-header fund-card-header--unassigned">
                                                            <span class="fund-card-name">{lbl.fundsUnassigned}</span>
                                                            <span class="fund-campaign-count">{fr.campaigns.length}</span>
                                                        </div>
                                                        <template if:true={fr.campaigns.length}>
                                                            <ul class="fund-campaign-list">
                                                                <template for:each={fr.campaigns} for:item="camp">
                                                                    <li key={camp.id} class="fund-campaign-row">
                                                                        <span class="fund-campaign-name">{camp.name}</span>
                                                                        <lightning-combobox
                                                                            label=""
                                                                            value=""
                                                                            options={fundMoveOptions}
                                                                            data-campaignid={camp.id}
                                                                            onchange={handleAssignCampaignToFund}
                                                                            variant="label-hidden"
                                                                            class="fund-move-combo">
                                                                        </lightning-combobox>
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </template>
                                                        <template if:false={fr.campaigns.length}>
                                                            <p class="fund-empty">{lbl.fundUnassignedEmpty}</p>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── Campaign Mapping ───────────────────────── -->
                                <template if:true={isSettingsCampaigns}>
                                    <div class="sm-section-title">{lbl.navCampaigns}</div>
                                    <div class="sm-section-body">
                                        <p class="settings-hint">{lbl.campHint}</p>

                                        <!-- Search to add/edit a campaign -->
                                        <template if:false={editingMapping}>
                                            <div class="owner-search-wrap">
                                                <lightning-icon icon-name="utility:search" size="xx-small" class="owner-search-icon"></lightning-icon>
                                                <input type="text" class="owner-search-input"
                                                       placeholder={lbl.campSearchPlaceholder}
                                                       value={campaignSearchTerm}
                                                       oninput={handleCampaignSearchInput} />
                                            </div>
                                            <template if:true={hasCampaignSearchResults}>
                                                <ul class="owner-dropdown">
                                                    <template for:each={campaignSearchResults} for:item="r">
                                                        <li key={r.id} class="owner-dropdown__item"
                                                            data-id={r.id} data-name={r.name}
                                                            data-formid={r.formId} data-managed={r.managed}
                                                            onclick={handleSelectCampaignResult}>
                                                            <span class="owner-type-badge">Campaign</span>{r.name}
                                                            <template if:true={r.formId}>
                                                                <span class="camp-formid-hint">({r.formId})</span>
                                                            </template>
                                                        </li>
                                                    </template>
                                                </ul>
                                            </template>
                                        </template>

                                        <!-- Edit form for selected campaign -->
                                        <template if:true={editingMapping}>
                                            <div class="camp-edit-box">
                                                <div class="camp-edit-box__name">{editingMapping.name}</div>
                                                <lightning-input
                                                    label={lbl.campZeffyFormId}
                                                    value={editingMapping.formId}
                                                    placeholder={lbl.campFormIdPlaceholder}
                                                    onchange={handleMappingFormIdChange}>
                                                </lightning-input>
                                                <lightning-input
                                                    type="checkbox"
                                                    label={lbl.campZeffyManaged}
                                                    checked={editingMapping.isZeffyManaged}
                                                    onchange={handleMappingManagedChange}>
                                                </lightning-input>
                                                <div class="camp-edit-box__actions">
                                                    <lightning-button label={lbl.btnCancel} variant="neutral" onclick={handleCancelCampaignMapping}></lightning-button>
                                                    <lightning-button label={lbl.saveBtn} variant="brand" onclick={handleSaveCampaignMapping}></lightning-button>
                                                </div>
                                            </div>
                                        </template>

                                        <!-- Existing mappings table -->
                                        <template if:true={hasCampaignMappings}>
                                            <table class="data-table" style="margin-top:12px">
                                                <thead>
                                                    <tr><th>{lbl.colCampaign}</th><th>{lbl.colZeffyFormId}</th><th>{lbl.colType}</th></tr>
                                                </thead>
                                                <tbody>
                                                    <template for:each={campaignMappingsList} for:item="c">
                                                        <tr key={c.id}>
                                                            <td>{c.name}</td>
                                                            <td><code>{c.formId}</code></td>
                                                            <td><span class={c.managedClass}>{c.managedLabel}</span></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </template>
                                        <template if:false={hasCampaignMappings}>
                                            <div class="empty-list" style="margin-top:12px">{lbl.noCampaigns}</div>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── Robot Health ───────────────────────────── -->
                                <template if:true={isSettingsHealth}>
                                <div class="health-wrap">
                                    <div class="health-top-bar">
                                        <!-- Semaphore + last received -->
                                        <div class="health-semaphore-wrap">
                                            <span class={healthStatusClass} title={healthStatusLabel}></span>
                                            <div class="health-semaphore-text">
                                                <span class="health-sem-label">{lbl.healthLastReceived}</span>
                                                <span class="health-sem-date">{healthLastReceived}</span>
                                                <template if:true={healthRelativeTime}>
                                                    <span class="health-sem-rel">{healthRelativeTime}</span>
                                                </template>
                                            </div>
                                        </div>
                                        <div class="health-top-actions">
                                            <!-- Test webhook creates real TEST tickets: admins only -->
                                            <template if:true={hasZeffyConnectSettings}>
                                                <button class="health-test-btn" onclick={handleOpenTestModal} title={lbl.testWebhookTitle}>
                                                    <lightning-icon icon-name="utility:connected_apps" size="x-small"></lightning-icon>
                                                    {lbl.testWebhookOpen}
                                                </button>
                                            </template>
                                            <button class="health-refresh-btn" onclick={handleHealthRefresh} title={lbl.healthRefresh}>
                                                <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                                            </button>
                                        </div>
                                    </div>

                                    <template if:true={isLoadingHealth}>
                                        <div class="health-loading"><lightning-spinner size="small" alternative-text={lbl.loading}></lightning-spinner></div>
                                    </template>
                                    <template if:false={isLoadingHealth}>

                                        <!-- 4 stat chips -->
                                        <div class="hchips-row">
                                            <div class="hchip">
                                                <span class="hchip__label">{lbl.healthToday}</span>
                                                <span class="hchip__val">{healthTodayTotal}</span>
                                            </div>
                                            <div class={healthTodayErrClass}>
                                                <span class="hchip__label">{lbl.healthErrChip}</span>
                                                <span class="hchip__val">{healthTodayErrors}</span>
                                            </div>
                                            <div class="hchip">
                                                <span class="hchip__label">{lbl.healthDupChip}</span>
                                                <span class="hchip__val">{healthTodayDuplicates}</span>
                                            </div>
                                            <div class="hchip">
                                                <span class="hchip__label">{lbl.healthRateChip}</span>
                                                <span class="hchip__val">{healthSuccessRate}</span>
                                            </div>
                                        </div>

                                        <!-- Gap alert (shows only when active but no recent call) -->
                                        <template if:true={healthHasGap}>
                                            <div class="health-gap-alert">
                                                <lightning-icon icon-name="utility:warning" size="x-small" class="health-gap-icon"></lightning-icon>
                                                <div class="health-gap-body">
                                                    <span class="health-gap-title">{lbl.healthGapTitle} {healthGapSince}</span>
                                                    <button class="health-gap-copy" onclick={handleCopyGapDate}>
                                                        {lbl.healthGapCopy}
                                                    </button>
                                                </div>
                                            </div>
                                        </template>

                                    </template>

                                    <!-- Log section -->
                                    <div class="health-log-header">
                                        <span class="health-log-title">{lbl.healthLogTitle}</span>
                                        <div class="health-log-controls">
                                            <select class="health-log-select" onchange={handleHealthLogFilterChange}>
                                                <template for:each={healthLogFilterOptions} for:item="opt">
                                                    <option key={opt.value} value={opt.value}>{opt.label}</option>
                                                </template>
                                            </select>
                                            <input type="text" class="health-log-search"
                                                   placeholder={lbl.healthSearchHolder}
                                                   value={healthLogSearch}
                                                   oninput={handleHealthLogSearch} />
                                        </div>
                                    </div>

                                    <template if:true={isLoadingLogs}>
                                        <div class="health-loading"><lightning-spinner size="small" alternative-text={lbl.loading}></lightning-spinner></div>
                                    </template>
                                    <template if:false={isLoadingLogs}>
                                        <template if:true={hasWebhookLogs}>
                                            <div class="health-log-list">
                                                <template for:each={webhookLogs} for:item="log">
                                                    <div key={log.id} class={log.rowClass}>
                                                        <div class="hlog-row">
                                                            <span class="hlog-dot" data-ok={log.isSuccess} data-warn={log.isWarning} data-err={log.isError}></span>
                                                            <span class="hlog-date">{log.formattedDate}</span>
                                                            <span class={log.badgeClass}>{log.displayStatus}</span>
                                                            <template if:true={log.isTest}>
                                                                <span class="hlog-test-badge">{lbl.testLogBadge}</span>
                                                            </template>
                                                            <span class="hlog-donor">{log.donorName}</span>
                                                            <span class="hlog-msg">{log.message}</span>
                                                            <template if:true={log.canReprocess}>
                                                                <button class="health-detail-btn"
                                                                        data-id={log.id}
                                                                        onclick={handleReprocessLog}
                                                                        title={lbl.btnReprocess}>↻ {lbl.btnReprocess}</button>
                                                            </template>
                                                            <template if:true={log.detail}>
                                                                <button class="health-detail-btn"
                                                                        data-id={log.id}
                                                                        onclick={handleToggleLogDetail}
                                                                        title={lbl.healthDetail}>▾</button>
                                                            </template>
                                                        </div>
                                                        <template if:true={log.showDetail}>
                                                            <pre class="health-detail-pre">{log.detail}</pre>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={hasWebhookLogs}>
                                            <div class="empty-list">{lbl.healthNoLogs}</div>
                                        </template>
                                    </template>

                                </div><!-- end health-wrap -->
                                </template>

                            </template>
                        </div>
                    </div>

                    <!-- Modal footer -->
                    <div class="sm-footer">
                        <lightning-button
                            label={lbl.btnClose}
                            variant="neutral"
                            onclick={handleCloseSettings}>
                        </lightning-button>
                        <template if:true={showModalSaveBtn}>
                            <lightning-button
                                label={saveAppBtnLabel}
                                variant="brand"
                                disabled={isSavingAppSettings}
                                onclick={handleModalSave}>
                            </lightning-button>
                        </template>
                    </div>

                </div>
            </div>
        </template>

    </div>

    <!-- ── Test Webhook Modal ────────────────────────────────────────────── -->
    <template if:true={showTestModal}>
        <div class="test-modal-backdrop" onclick={handleCloseTestModal}></div>
        <div class="test-modal" role="dialog" aria-modal="true">
            <div class="test-modal__header">
                <lightning-icon icon-name="utility:connected_apps" size="small" class="test-modal__hdr-icon"></lightning-icon>
                <span class="test-modal__title">{lbl.testWebhookTitle}</span>
                <button class="test-modal__close" onclick={handleCloseTestModal} title={lbl.ttClose}>✕</button>
            </div>
            <div class="test-modal__body">
                <p class="test-modal__desc">{lbl.testWebhookDesc}</p>
                <div class="test-modal__form">
                    <lightning-combobox
                        label={lbl.testWebhookEvent}
                        value={testWebhookEvent}
                        options={testWebhookEventOptions}
                        onchange={handleTestWebhookEventChange}
                        class="test-modal__combo">
                    </lightning-combobox>
                    <lightning-button
                        label={testWebhookSendLabel}
                        variant="brand"
                        icon-name="utility:send"
                        disabled={isSendingTest}
                        onclick={handleSendTestWebhook}>
                    </lightning-button>
                </div>
                <template if:true={isSendingTest}>
                    <div class="test-modal__sending">
                        <lightning-spinner size="small" alternative-text={lbl.testWebhookSending}></lightning-spinner>
                        <span>{lbl.testWebhookSending}</span>
                    </div>
                </template>
                <template if:true={testWebhookResultSuccess}>
                    <div class="test-modal__result test-modal__result--ok">
                        <div class="test-modal__result-icon">✓</div>
                        <div class="test-modal__result-body">
                            <div class="test-modal__result-title">{lbl.testWebhookOk}</div>
                            <div class="test-modal__result-meta">
                                <span class="test-modal__result-label">Event:</span> {testWebhookResult.event}
                            </div>
                            <div class="test-modal__result-meta">
                                <span class="test-modal__result-label">{lbl.testWebhookTxId}:</span>
                                <span class="test-modal__result-txid">{testWebhookResult.txId}</span>
                            </div>
                            <div class="test-modal__result-meta">
                                <span class="test-modal__result-label">HTTP:</span> {testWebhookResult.status}
                            </div>
                        </div>
                    </div>
                </template>
                <template if:true={testWebhookResultFail}>
                    <div class="test-modal__result test-modal__result--fail">
                        <div class="test-modal__result-icon">✕</div>
                        <div class="test-modal__result-body">
                            <div class="test-modal__result-title">{lbl.testWebhookFail}</div>
                            <div class="test-modal__result-msg">{testWebhookResultMessage}</div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="test-modal__footer">
                <lightning-button
                    label={lbl.btnClose}
                    variant="neutral"
                    onclick={handleCloseTestModal}>
                </lightning-button>
            </div>
        </div>
    </template>

    <!-- ── Transaction Timeline Modal ─────────────────────────────────────── -->
    <template if:true={showTimeline}>
        <div class="timeline-backdrop" onclick={handleCloseTimeline}></div>
        <div class="timeline-modal" role="dialog" aria-modal="true">
            <div class="timeline-modal__header">
                <span class="timeline-modal__title">{lbl.timelineTitle} — {timelineTicketName}</span>
                <button class="timeline-modal__close" onclick={handleCloseTimeline} title={lbl.ttClose}>✕</button>
            </div>
            <div class="timeline-modal__body">
                <template if:true={timelineLoading}>
                    <div class="timeline-loading">{lbl.timelineLoading}</div>
                </template>
                <template if:false={timelineLoading}>
                    <template if:true={timelineEntries.length}>
                        <ul class="timeline-list">
                            <template for:each={timelineEntries} for:item="entry">
                                <li key={entry.occurredAt} class="timeline-item">
                                    <span class="timeline-item__dot"></span>
                                    <div class="timeline-item__content">
                                        <div class="timeline-item__row">
                                            <span class="timeline-item__time">{entry.occurredAt}</span>
                                            <span class="timeline-item__event">{entry.eventType}</span>
                                            <span class="timeline-item__status">{entry.status}</span>
                                        </div>
                                        <div class="timeline-item__msg">{entry.message}</div>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template if:false={timelineEntries.length}>
                        <p class="timeline-empty">{lbl.timelineEmpty}</p>
                    </template>
                </template>
            </div>
        </div>
    </template>

    <!-- ══ BULK RESOLVE MODAL ═══════════════════════════════════════════════ -->
    <template if:true={showBulkModal}>
        <div class="modal-overlay modal-overlay--top">
            <div class="wiz-dialog">

                <div class="wiz-header">
                    <span class="wiz-header__title">{lbl.bulkModalTitle}</span>
                    <button class="sm-close-btn" onclick={handleCloseBulkModal} disabled={bulkResolving} title={lbl.ttClose}>
                        <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                    </button>
                </div>

                <!-- Step indicator (same as the single-ticket wizard) -->
                <div class="wiz-steps">
                    <div class={bulkStep1Class}>
                        <span class="wiz-step__num">1</span>
                        <span class="wiz-step__label">{lbl.wizStep1}</span>
                    </div>
                    <div class="wiz-step-line"></div>
                    <div class={bulkStep2Class}>
                        <span class="wiz-step__num">2</span>
                        <span class="wiz-step__label">{lbl.wizStep2}</span>
                    </div>
                </div>

                <!-- Step 1 – account selection (laid out like the single-ticket wizard) -->
                <template if:true={isBulkStep1}>
                    <div class="wiz-body">
                        <p class="wiz-body__hint">{lbl.bulkStep1Hint}</p>

                        <!-- Donor box: "From Zeffy" title, most used values, Zeffy ID line; other values under "See differences" -->
                        <div class="bulk-donor">
                            <span class="bulk-donor__title">{lbl.rvFromZeffy}</span>
                            <div class="bulk-id-summary">
                                <div class="bulk-donor__row">
                                    <span class="bulk-donor__lbl">{lbl.bulkVarNameHdr}</span>
                                    <span class="bulk-donor__name">{bulkMainName}</span>
                                </div>
                                <template if:true={bulkMainEmail}>
                                    <div class="bulk-donor__row">
                                        <span class="bulk-donor__lbl">{lbl.bulkVarEmailHdr}</span>
                                        <span class="bulk-donor__val">{bulkMainEmail}</span>
                                    </div>
                                </template>
                                <template if:true={bulkMainAddr}>
                                    <div class="bulk-donor__row">
                                        <span class="bulk-donor__lbl">{lbl.bulkVarAddrHdr}</span>
                                        <span class="bulk-donor__val">{bulkMainAddr}</span>
                                    </div>
                                </template>
                                <div class="bulk-id-summary__row bulk-donor__zid">
                                    <span class="bulk-donor__lbl">{lbl.bulkIdLabel}</span>
                                    <span class="bulk-id-summary__same">✓ {bulkIdSameText}</span>
                                    <template if:false={bulkHasVariations}>
                                        <span class="csh-donor-sep">·</span>
                                        <span class="bulk-id-summary__ok">{lbl.bulkAllMatch}</span>
                                    </template>
                                    <template if:true={bulkHasVariations}>
                                        <button class="bulk-id-summary__toggle" aria-expanded={bulkVarOpenStr} onclick={handleBulkToggleVariations}>{bulkVarToggleLabel}</button>
                                    </template>
                                </div>
                                <template if:true={_bulkVariationsOpen}>
                                    <div class="bulk-id-summary__details">
                                        <template if:true={bulkNamesVary}>
                                            <div class="bulk-var-group">
                                                <span class="bulk-var-group__hdr">{lbl.bulkVarNameHdr}</span>
                                                <template for:each={bulkNameVariants} for:item="v">
                                                    <span key={v.key} class="bulk-var-chip">{v.value} <span class="bulk-var-chip__n">{v.count}</span></span>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={bulkEmailsVary}>
                                            <div class="bulk-var-group">
                                                <span class="bulk-var-group__hdr">{lbl.bulkVarEmailHdr}</span>
                                                <template for:each={bulkEmailVariants} for:item="v">
                                                    <span key={v.key} class="bulk-var-chip">{v.value} <span class="bulk-var-chip__n">{v.count}</span></span>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:true={bulkAddrsVary}>
                                            <div class="bulk-var-group">
                                                <span class="bulk-var-group__hdr">{lbl.bulkVarAddrHdr}</span>
                                                <template for:each={bulkAddrVariants} for:item="v">
                                                    <span key={v.key} class="bulk-var-chip">{v.value} <span class="bulk-var-chip__n">{v.count}</span></span>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Mode chooser: only the chosen path is shown below -->
                        <div class="wiz-mode-row" role="radiogroup" aria-label={lbl.wizHint}>
                            <button class={bulkModeLinkClass} data-mode="link" role="radio"
                                    aria-checked={isBulkLinkModeStr} onclick={handleBulkModeChange}>
                                <span class="wiz-mode-card__icon">
                                    <lightning-icon icon-name="utility:link" size="small"></lightning-icon>
                                </span>
                                <span class="wiz-mode-card__text">
                                    <span class="wiz-mode-card__title">{lbl.wizModeLink}</span>
                                    <span class="wiz-mode-card__desc">{lbl.wizModeLinkDesc}</span>
                                </span>
                                <span class="wiz-mode-card__radio"></span>
                            </button>
                            <button class={bulkModeCreateClass} data-mode="create" role="radio"
                                    aria-checked={isBulkCreateModeStr} onclick={handleBulkModeChange}>
                                <span class="wiz-mode-card__icon">
                                    <lightning-icon icon-name="utility:add" size="small"></lightning-icon>
                                </span>
                                <span class="wiz-mode-card__text">
                                    <span class="wiz-mode-card__title">{lbl.wizModeCreate}</span>
                                    <span class="wiz-mode-card__desc">{lbl.wizModeCreateDesc}</span>
                                </span>
                                <span class="wiz-mode-card__radio"></span>
                            </button>
                        </div>

                        <template if:true={isBulkLinkMode}>
                            <div class="candidates-section__header">
                                <div class="candidates-section__left">
                                    <span class="candidates-section__title">{lbl.wizPossibleMatches}</span>
                                    <span class="csh-donor-name">{bulkHeadName}</span>
                                    <template if:true={bulkHeadEmail}>
                                        <span class="csh-donor-sep">·</span>
                                        <span class="csh-donor-email">{bulkHeadEmail}</span>
                                    </template>
                                </div>
                                <template if:true={_bulkLoadingCandidates}>
                                    <lightning-spinner size="x-small" alternative-text={lbl.loading}></lightning-spinner>
                                </template>
                                <template if:true={bulkShowAllVisible}>
                                    <button class="bulk-id-summary__toggle" aria-expanded={bulkShowAllExpanded} onclick={handleBulkShowAllMatches}>{bulkShowAllLabel}</button>
                                </template>
                            </div>

                            <template if:true={bulkHasVisibleCandidates}>
                                <div class={bulkCandListClass}>
                                    <template for:each={bulkVisibleCandidates} for:item="c">
                                        <div key={c.id} class={c.cardClass} data-id={c.id} data-name={c.name} onclick={handleBulkCandidateSelect}>
                                            <div class="candidate-card__top">
                                                <span class="candidate-card__name">{c.name}</span>
                                                <span class={c.badgeClass}>{c.scoreLabel}</span>
                                            </div>
                                            <div class="candidate-card__meta">
                                                <template if:true={c.email}>
                                                    <span class="candidate-card__chip">{c.email}</span>
                                                </template>
                                                <template if:true={c.phone}>
                                                    <span class="candidate-card__chip">{c.phone}</span>
                                                </template>
                                                <template if:true={c.city}>
                                                    <span class="candidate-card__chip">{c.city}</span>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template if:false={_bulkCandidates.length}>
                                <template if:false={_bulkLoadingCandidates}>
                                    <div class="no-candidates">{lbl.wizNoMatches}</div>
                                </template>
                            </template>

                            <!-- Manual search (name or email) -->
                            <div class="manual-search-row">
                                <lightning-record-picker
                                    label={lbl.wizSearchSF}
                                    placeholder={lbl.wizSearchPlaceholder}
                                    object-api-name="Account"
                                    value={_bulkSelectedAcctId}
                                    matching-info={accountMatchingInfo}
                                    onchange={handleBulkAccountSelected}>
                                </lightning-record-picker>
                            </div>
                        </template>

                        <!-- Create new: account type picker -->
                        <template if:true={isBulkCreateMode}>
                            <template if:true={bulkDuplicateWarning}>
                                <div class="dup-warning" role="alert">
                                    <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon>
                                    <div class="dup-warning__body">
                                        <p class="dup-warning__title">{lbl.dupWarnTitle}</p>
                                        <p>{bulkDuplicateWarning.body}</p>
