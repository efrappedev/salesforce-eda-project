<template>
    <div class="dub" role="dialog" aria-modal="true" aria-label={i18n.btnBuilder} onkeydown={handleKeydown}>
        <div class="dub-wrap">
            <!-- Publish bar: the form (name + public link), form actions, publish state. -->
            <div role="banner" class="dub-bar">
                <div class="dub-switch">
                    <span class="dub-switch__txt">
                        <span class="dub-switch__name">{currentFormLabel}<template lwc:if={isMainForm}><span class="dub-tag">{i18n.builderMainForm}</span></template></span>
                        <span class="dub-switch__path dub-mono">{publicUrlShort}</span>
                    </span>
                    <svg class="dub-switch__chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                    <select class="dub-switch__select" aria-label={i18n.builderChangeForm} onchange={handleFormSelect} disabled={isPublishing}>
                        <template for:each={formOptions} for:item="f">
                            <option key={f.value} value={f.value} selected={f.selected}>{f.label}</option>
                        </template>
                    </select>
                </div>
                <template lwc:if={publicUrl}>
                    <button class={copyBtnClass} type="button" onclick={handleCopyUrl} title={i18n.builderCopyLink} aria-label={i18n.builderCopyLink}>
                        <template lwc:if={urlCopied}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></template>
                        <template lwc:else><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"></rect><path d="M5 15V5a2 2 0 0 1 2-2h10"></path></svg></template>
                    </button>
                    <template lwc:if={urlCopied}><span class="dub-copied" role="status">{i18n.builderLinkCopied}</span></template>
                    <a class="dub-ib" href={publicUrl} target="_blank" rel="noopener" title={i18n.builderOpenPage} aria-label={i18n.builderOpenPage}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"></path><path d="M20 4l-9 9"></path><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg></a>
                </template>
                <span class="dub-bar__sep"></span>
                <template lwc:if={showMultiSwitch}>
                    <span class="dub-ms">
                        <button type="button" class={multiClass} role="switch" aria-checked={multiChecked} aria-label={i18n.builderMultiLabel} onclick={handleMultiToggle}></button>
                        <span class="dub-ms__label" onclick={handleMultiToggle}>{i18n.builderMultiLabel}</span>
                        <button type="button" class={multiTipClass} aria-label={i18n.builderMultiHelp} onclick={handleMultiTip}>?</button>
                        <template lwc:if={multiTip}>
                            <span class="dub-tip" role="tooltip"><b>{i18n.builderMultiLabel}</b>{i18n.builderMultiHelp}</span>
                        </template>
                    </span>
                    <span class="dub-bar__sep"></span>
                </template>
                <template lwc:if={showMainToggle}>
                    <button class={mainToggleClass} type="button" role="switch" aria-checked={isMainForm} onclick={handleMainToggle} disabled={isPublishing} title={mainToggleTitle} aria-label={mainToggleTitle}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"></path><template lwc:if={isMainForm}><path d="M9 12l2 2 4-4"></path></template></svg></button>
                    <template lwc:if={isMainForm}><span class="dub-bar__sep"></span></template>
                </template>
                <template lwc:if={showDeleteFormButton}>
                    <button class="dub-ib dub-ib--danger" type="button" onclick={handleDeleteForm} disabled={isPublishing} title={i18n.builderDeleteForm} aria-label={i18n.builderDeleteForm}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"></path><path d="M10 11v6M14 11v6"></path><path d="M6 7l1 13h10l1-13"></path><path d="M9 7V4h6v3"></path></svg></button>
                    <span class="dub-bar__sep"></span>
                </template>
                <button class="dub-btn dub-btn--bar" type="button" onclick={handleNewForm} disabled={newFormDisabled}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>{i18n.builderNewForm}</button>
                <div class="dub-bar__actions">
                    <template lwc:if={isPublishing}>
                        <span class="dub-pill dub-pill--run"><span class="dub-dot"></span>{i18n.builderPublishing}</span>
                    </template>
                    <template lwc:elseif={changeCount}>
                        <span class="dub-pill dub-pill--draft"><span class="dub-dot"></span>{unsavedText}</span>
                        <button class="dub-btn dub-btn--bar dub-btn--quiet" type="button" onclick={handleDiscard} disabled={isLoading}>{i18n.builderDiscard}</button>
                    </template>
                    <template lwc:else>
                        <span class="dub-pill dub-pill--ok"><span class="dub-dot"></span>{i18n.builderPublished}</span>
                    </template>
                    <button class="dub-btn dub-btn--bar dub-btn--primary" type="button" onclick={handlePublish} disabled={noChanges}><template lwc:if={publishShowsLock}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></template>{publishLabel}</button>
                    <span class="dub-bar__sep"></span>
                    <button class="dub-ib" type="button" onclick={handleClose} title={i18n.builderClose} aria-label={i18n.builderClose}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
                </div>
                <template lwc:if={lockStrip}>
                    <div class={lockStrip.className} role="status">
                        <template lwc:if={lockStrip.isCooldown}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></template>
                        <template lwc:elseif={lockStrip.isMine}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg></template>
                        <template lwc:else><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></template>
                        <span class="dub-lockstrip__text">{lockStrip.text}</span>
                        <template lwc:if={lockStrip.isCooldown}>
                            <span class="dub-lockstrip__track"><span style={lockStrip.drainStyle}></span></span>
                        </template>
                        <template lwc:else>
                            <span class="dub-lockstrip__track dub-lockstrip__track--run"><span></span></span>
                        </template>
                    </div>
                </template>
            </div>

            <template lwc:if={showNewForm}>
                <div class="dub-newform__backdrop" onclick={handleCancelNewForm}></div>
                <div class={newFormClass} role="dialog" aria-modal="true" aria-label={i18n.builderNewFormTitle} onkeydown={handleNewFormKey}>
                    <h2 class="dub-newform__title">{i18n.builderNewFormTitle}</h2>
                    <label class="dub-field">
                        <span class="dub-label-sm">{i18n.builderNewFormName}</span>
                        <input class="dub-input" maxlength="40" value={newForm.name} oninput={handleNewFormName}
                            placeholder={i18n.builderNewFormNamePlaceholder} disabled={newForm.creating}>
                    </label>
                    <template lwc:if={newForm.advanced}>
                        <div class="dub-newform__adv">
                            <p class="dub-hint">{i18n.builderNewFormAdvancedIntro}</p>
                            <div class="dub-newform__sec">
                                <span class="dub-newform__sectitle">{i18n.builderAdvWhere}</span>
                                <div class="dub-newform__grid">
                                    <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvSite}</span>
                                    <select class="dub-select dub-newform__select" data-key="site" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advSiteOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                    <label class="dub-field"><span class="dub-label-sm">{i18n.formWizardObjectField}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderNewFormObjectHint} data-tip={i18n.builderNewFormObjectHint}>ⓘ</span></span>
                                    <select class="dub-select dub-newform__select" data-key="object" onchange={handleAdvObject} disabled={newForm.creating}>
                                        <template for:each={advObjectOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                </div>
                            </div>
                            <template lwc:if={newForm.loadingFields}>
                                <p class="dub-hint">{i18n.builderLoading}</p>
                            </template>
                            <template lwc:if={advHasObject}>
                                <div class="dub-newform__sec">
                                    <span class="dub-newform__sectitle">{i18n.builderAdvIdentity}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderNewFormIdentityHint} data-tip={i18n.builderNewFormIdentityHint}>ⓘ</span></span>
                                    <div class="dub-newform__grid">
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvIdentity1}</span>
                                            <span class="dub-newform__combo">
                                    <select class="dub-select dub-newform__select" data-key="identity1" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advIdentity1Options} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                    <select class="dub-select dub-newform__select dub-newform__cmp" data-key="comparison1" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advComparison1Options} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                            </span>
                                        </label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvIdentity2}</span>
                                            <span class="dub-newform__combo">
                                    <select class="dub-select dub-newform__select" data-key="identity2" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advIdentity2Options} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                                <template lwc:if={advHasIdentity2}>
                                    <select class="dub-select dub-newform__select dub-newform__cmp" data-key="comparison2" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advComparison2Options} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select>
                                                </template>
                                            </span>
                                        </label>
                                    </div>
                                </div>
                                <div class="dub-newform__sec">
                                    <span class="dub-newform__sectitle">{i18n.builderAdvOptional}</span>
                                    <div class="dub-newform__grid dub-newform__grid--3">
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvRecordName}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderAdvRecordNameHint} data-tip={i18n.builderAdvRecordNameHint}>ⓘ</span></span>
                                    <select class="dub-select dub-newform__select" data-key="recordName" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advRecordNameOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvFilter}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderAdvFilterHint} data-tip={i18n.builderAdvFilterHint}>ⓘ</span></span>
                                    <select class="dub-select dub-newform__select" data-key="filterField" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advFilterOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvFilterValue}</span>
                                            <input class="dub-input" data-key="filterValue" value={newForm.adv.filterValue} oninput={handleAdvInput}
                                                placeholder={i18n.builderNewFormFilterPlaceholder} disabled={newForm.creating}></label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvLock}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderAdvLockHint} data-tip={i18n.builderAdvLockHint}>ⓘ</span></span>
                                    <select class="dub-select dub-newform__select" data-key="lockField" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advLockOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvLockDate}</span>
                                    <select class="dub-select dub-newform__select" data-key="lockDateField" onchange={handleAdvInput} disabled={newForm.creating}>
                                        <template for:each={advLockDateOptions} for:item="o">
                                            <option key={o.value} value={o.value} selected={o.selected}>{o.label}</option>
                                        </template>
                                    </select></label>
                                        <label class="dub-field"><span class="dub-label-sm">{i18n.builderAdvQueue}<span class="dub-newform__info" tabindex="0" role="note" aria-label={i18n.builderAdvQueueHint} data-tip={i18n.builderAdvQueueHint}>ⓘ</span></span>
                                            <input class="dub-input" data-key="queue" value={newForm.adv.queue} oninput={handleAdvInput}
                                                placeholder={i18n.builderAdvQueuePlaceholder} disabled={newForm.creating}></label>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="dub-field">
                            <span class="dub-label-sm">{i18n.builderNewFormBasedOn}</span>
                            <div class="dub-newform__sites" role="group">
                                <template for:each={newFormBases} for:item="o">
                                    <button type="button" key={o.value} class="dub-newform__site" data-value={o.value} aria-pressed={o.pressed}
                                        onclick={handleNewFormSite} disabled={newForm.creating}>{o.label}</button>
                                </template>
                            </div>
                        </div>
                    </template>
                    <template lwc:if={newFormShowMulti}>
                        <span class="dub-ms">
                        <button type="button" class={newFormMultiClass} role="switch" aria-checked={newFormMultiChecked} aria-label={i18n.builderMultiLabel} onclick={handleNewFormMulti}></button>
                        <span class="dub-ms__label" onclick={handleNewFormMulti}>{i18n.builderMultiLabel}</span>
                        <button type="button" class={newFormMultiTipClass} aria-label={i18n.builderMultiHelp} onclick={handleNewFormMultiTip}>?</button>
                        <template lwc:if={newForm.multiTip}>
                            <span class="dub-tip" role="tooltip"><b>{i18n.builderMultiLabel}</b>{i18n.builderMultiHelp}</span>
                        </template>
                    </span>
                    </template>
                    <template lwc:if={newFormNoCore}>
                        <p class="dub-error">{i18n.builderNewFormNoCore}</p>
                    </template>
                    <template lwc:if={newForm.error}>
                        <p class="dub-error">{newForm.error}</p>
                    </template>
                    <p class="dub-hint">{i18n.builderNewFormNext}</p>
                    <div class="dub-newform__actions">
                        <button class="dub-newform__advlink" type="button" onclick={handleToggleNewFormAdvanced} disabled={newForm.creating}>{newFormAdvancedLabel}</button>
                        <button class="dub-btn" type="button" onclick={handleCancelNewForm} disabled={newForm.creating}>{i18n.builderNewFormCancel}</button>
                        <button class="dub-btn dub-btn--primary" type="button" onclick={handleCreateNewForm} disabled={newFormCantCreate}>
                            <template lwc:if={newForm.creating}>{i18n.builderNewFormCreating}</template>
                            <template lwc:else>{i18n.builderNewFormCreate}</template>
                        </button>
                    </div>
                </div>
            </template>

            <template lwc:if={showDeleteForm}>
                <div class="dub-newform__backdrop" onclick={handleCancelDeleteForm}></div>
                <div class="dub-newform dub-newform--danger" role="alertdialog" aria-modal="true" aria-label={i18n.deleteFormConfirmTitle} onkeydown={handleDeleteFormKey}>
                    <h2 class="dub-newform__title">{i18n.deleteFormConfirmTitle}</h2>
                    <div class="dub-newform__target">
                        <strong>{deleteForm.label}</strong>
                        <span class="dub-mono">{deleteForm.url}</span>
                    </div>
                    <p class="dub-hint">{i18n.builderDeleteWarning}</p>
                    <template lwc:if={deleteForm.error}>
                        <p class="dub-error">{deleteForm.error}</p>
                    </template>
                    <div class="dub-newform__actions">
                        <button class="dub-btn" type="button" onclick={handleCancelDeleteForm} disabled={deleteForm.deleting}>{i18n.btnCancelDelete}</button>
                        <button class="dub-btn dub-btn--danger-solid" type="button" onclick={handleConfirmDeleteForm} disabled={deleteForm.deleting}>
                            <template lwc:if={deleteForm.deleting}>{i18n.builderDeleting}</template>
                            <template lwc:else>{i18n.builderDeleteForm}</template>
                        </button>
                    </div>
                </div>
            </template>

            <template if:true={isLoading}>
                <div class="dub-pane dub-loading"><lightning-spinner alternative-text={i18n.builderLoading} size="small"></lightning-spinner></div>
            </template>
            <template if:true={loadError}>
                <div class="dub-pane dub-loading"><p class="dub-error">{loadError}</p></div>
            </template>

            <template if:true={showBody}>
                <div class="dub-panes">
                    <!-- Palette -->
                    <div role="complementary" class="dub-pane" aria-label={leftPaneTitle}>
                        <div class="dub-pane__head"><span class="dub-pane__title">{leftPaneTitle}</span></div>
                        <div class="dub-pane__body">
                            <div class="dub-maintabs" role="tablist">
                                <button type="button" role="tab" class="dub-maintab" data-value="questions" aria-selected={leftTabQuestionsSelected} onclick={handleLeftTab}>{i18n.builderTabQuestions}</button>
                                <button type="button" role="tab" class="dub-maintab" data-value="tools" aria-selected={leftTabToolsSelected} onclick={handleLeftTab}>{i18n.builderTabTools}</button>
                            </div>
                            <template lwc:if={isQuestionsTab}>
                            <div class="dub-palette-top">
                            <div class="dub-tabs" role="tablist">
                                <button type="button" role="tab" class="dub-tab" data-value="fields" aria-selected={tabFieldsSelected} onclick={handlePaletteTab}>{i18n.builderRecordFields} <span class="dub-tab__count">{tabFieldsCount}</span></button>
                                <button type="button" role="tab" class="dub-tab dub-tab--related" data-value="related" aria-selected={tabRelatedSelected} onclick={handlePaletteTab}>{i18n.builderRelated} <span class="dub-tab__count">{tabRelatedCount}</span></button>
                            </div>
                            <input class="dub-search" type="search" placeholder={i18n.builderSearch} aria-label={i18n.builderSearch}
                                value={search} oninput={handleSearch}>
                            </div>
                            <template if:true={isFieldsTab}>
                                <div class="dub-group">
                                    <template for:each={fieldChips} for:item="c">
                                        <div key={c.id} class={c.className} draggable={c.draggable} data-chip={c.id}
                                            ondragstart={handleChipDragStart} ondragend={handleDragEnd}>
                                            <span class="dub-chip__grip" aria-hidden="true">⋮⋮</span>
                                            <span class="dub-chip__name">{c.name}<small class={c.subClass} title={c.sub}>{c.sub}</small></span>
                                            <template if:true={c.used}><span class="dub-chip__add">{i18n.builderInUse}</span></template>
                                            <template if:false={c.used}>
                                                <button type="button" class="dub-icon-btn dub-chip__add" data-chip={c.id}
                                                    onclick={handleChipAdd} aria-label={c.addLabel} title={c.addLabel}>+</button>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={hasFieldChips}><span class="dub-hint">{i18n.builderNoResults}</span></template>
                                </div>
                            </template>
                            <template if:true={isRelatedTab}>
                                <div class="dub-group">
                                    <template for:each={relatedChips} for:item="c">
                                        <div key={c.id} class={c.className} draggable={c.draggable} data-chip={c.id}
                                            ondragstart={handleChipDragStart} ondragend={handleDragEnd}>
                                            <span class="dub-chip__grip" aria-hidden="true">⋮⋮</span>
                                            <span class="dub-chip__name">{c.name}<small title={c.sub}>{c.sub}</small></span>
                                            <template if:true={c.used}>
                                                <template lwc:if={c.isTable}>
                                                    <button type="button" class="dub-icon-btn dub-chip__add dub-chip__remove" data-chip={c.id}
                                                        onclick={handleChipRemove} aria-label={i18n.builderTableRemove} title={i18n.builderTableRemove}>−</button>
                                                </template>
                                                <template lwc:else><span class="dub-chip__add">{i18n.builderInUse}</span></template>
                                            </template>
                                            <template if:false={c.used}>
                                                <button type="button" class="dub-icon-btn dub-chip__add" data-chip={c.id}
                                                    onclick={handleChipAdd} aria-label={c.addLabel} title={c.addLabel}>+</button>
                                            </template>
                                        </div>
                                    </template>
                                    <template if:false={hasRelatedChips}><span class="dub-hint">{i18n.builderNoResults}</span></template>
                                </div>
                            </template>
                            <p class="dub-legend">{i18n.builderLegend}</p>
                            </template>
                            <template lwc:else>
                                <p class="dub-hint">{i18n.builderToolsHint}</p>
                                <template for:each={toolGroups} for:item="g">
                                    <div key={g.key} class="dub-tools-group">
                                        <span class="dub-label-sm">{g.label}</span>
                                        <div class="dub-tiles">
                                            <template for:each={g.tools} for:item="t">
                                                <button key={t.type} type="button" class="dub-tile" data-type={t.type} onclick={handleToolAdd} title={t.hint}>
                                                    <lightning-icon icon-name={t.icon} size="x-small" class="dub-tile__icon"></lightning-icon>
                                                    <span class="dub-tile__name">{t.label}</span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                                <div class="dub-tile-note">
                                    <lightning-icon icon-name="utility:layout" size="x-small"></lightning-icon>

                                                </div>
                                            </template>
                                            <template lwc:elseif={it.is_lookupTitle}>
                                                <div class="dub-paper__title" style={textLookupTitle.blockStyle}>

                                            </template>
                                        </div>
                                    </template>
                                </template>

                                <!-- Screen 3: messages (record locked, request pending, request sent) -->
                                <template if:true={isMessagesScreen}>

                                            <template for:each={card.items} for:item="it">
                                                <div key={it.id} class={it.itemClass}>
                                                    <template lwc:if={it.isBlock}>
                                                        <div class={it.className} data-b={it.id} tabindex="0" role="button" onclick={handleBlockClick} onkeydown={handleBlockKey}>
                                                            <span class="dub-blk__tag">{it.label}<template lwc:if={it.incomplete}><span class="dub-warn-tag">{it.incompleteTag}</span></template></span>
                                                            <c-data-update-block block={it.block} lang={previewLang} mode="preview"></c-data-update-block>

                                            </template>

                                    <div class="dub-msg-card dub-msg-card--plain">

                                            <span class={textErrNoChanges.className} data-text="errNoChanges" tabindex="0"
                                                onclick={handleTextSelect} onkeydown={handleTextKey}>{textErrNoChanges.value}<template if:true={textErrNoChanges.isCustom}><span class="dub-custom-tag">{textErrNoChanges.customTag}</span></template></span>
                                        </div>
                                    </div>
                                </template>

                                <!-- Screen 2: questions -->
                                <template if:true={isQuestionsScreen}>
                                    <template for:each={headItems} for:item="it">

                                                    <div class="dub-blk__tools">
                                                        <button type="button" class="dub-icon-btn" data-b={it.id} data-dir="-1" onclick={handleBlockMove} title={i18n.builderMoveUp} aria-label={i18n.builderMoveUp}>↑</button>
                                                        <button type="button" class="dub-icon-btn" data-b={it.id} data-dir="1" onclick={handleBlockMove} title={i18n.builderMoveDown} aria-label={i18n.builderMoveDown}>↓</button>
                                                        <button type="button" class="dub-icon-btn" data-b={it.id} onclick={handleBlockDuplicate} title={i18n.builderDuplicate} aria-label={i18n.builderDuplicate}>⧉</button>
                                                        <button type="button" class="dub-icon-btn dub-icon-btn--danger" data-b={it.id} onclick={handleBlockRemove} title={i18n.builderRemoveBlock} aria-label={i18n.builderRemoveBlock}>✕</button>
                                                    </div>
                                                </div>
                                            </template>
                                            <template lwc:elseif={it.is_formTitle}>
                                                <div class="dub-paper__title" style={textFormTitle.blockStyle}>

                                                </div>
                                            </template>
                                            <template lwc:elseif={it.is_formSubtitle}>
                                                <div class="dub-paper__sub" style={textFormSubtitle.blockStyle}>
                                                    <span class={textFormSubtitle.className} data-text="formSubtitle" tabindex="0"
                                                        onclick={handleTextSelect} onkeydown={handleTextKey}><template for:each={textFormSubtitle.runs} for:item="r"><span key={r.key} style={r.style}>{r.t}</span></template><template if:true={textFormSubtitle.isCustom}><span class="dub-custom-tag">{textFormSubtitle.customTag}</span></template></span>
                                                </div>
                                            </template>
                                        </div>
                                    </template>

                                    <template for:each={previewSections} for:item="s">

                                                <div class={s.emptyClass} data-section={s.id} ondragover={handleEmptyDragOver} ondrop={handleDrop}>{pv.builderDropHere}</div>

                                                <div key={q.id} class="dub-q-wrap">
                                                    <template if:true={q.dropBefore}><div class="dub-dropline"></div></template>

                                                        <div class="dub-blk-drag" data-q={q.id} draggable="true" ondragstart={handleQuestionDragStart}

                                                                <c-data-update-block block={q.block} lang={previewLang} mode="preview"></c-data-update-block>

                                                                    <button type="button" class="dub-icon-btn" data-b={q.id} data-dir="-1" onclick={handleBlockMove} title={i18n.builderMoveUp} aria-label={i18n.builderMoveUp}>↑</button>

                                                                    <button type="button" class="dub-icon-btn dub-icon-btn--danger" data-b={q.id} onclick={handleBlockRemove} title={i18n.builderRemoveBlock} aria-label={i18n.builderRemoveBlock}>✕</button>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </template>
                                                    <template lwc:elseif={q.isTable}>
                                                        <div class={q.className} data-q={q.id} data-t={q.id} draggable="true" onclick={handleTableClick}

                                                            ondrop={handleDrop} ondragend={handleDragEnd} role="button" tabindex="0" onkeydown={handleTableKey}>

                                                                <span class="dub-htable__title">{q.title}</span>
                                                                <template lwc:if={q.hasHelp}><span class="dub-htable__info" title={q.help}>i</span></template>
                                                                <template lwc:if={q.isNew}><span class="dub-new-tag">{i18n.builderNewTag}</span></template>
                                                                <template lwc:if={q.incomplete}><span class="dub-warn-tag">{i18n.builderIncompleteTag}</span></template>
                                                                <span class="dub-htable__tools">
                                                                    <button type="button" class="dub-icon-btn" data-q={q.id} data-dir="-1" onclick={handleMove}
                                                                        title={i18n.builderMoveUp} aria-label={i18n.builderMoveUp}>↑</button>
                                                                    <button type="button" class="dub-icon-btn" data-q={q.id} data-dir="1" onclick={handleMove}
                                                                        title={i18n.builderMoveDown} aria-label={i18n.builderMoveDown}>↓</button>
                                                                    <button type="button" class="dub-icon-btn dub-icon-btn--danger" data-t={q.id} onclick={handleTableRemove}

                                                                            <template lwc:elseif={f.isPicklist}>
                                                                                <select class="dub-q__input" tabindex="-1" disabled><option></option></select>
                                                                            </template>
                                                                            <template lwc:else>
                                                                                <input class="dub-q__input" type={f.htmlType} tabindex="-1" readonly>
                                                                            </template>
                                                                        </div>
                                                                    </template>
                                                                </div>
                                                            </template>

                                                                    <template for:each={r.cells} for:item="c">
                                                                        <span key={c.key} class="dub-htable__td"></span>
                                                                    </template>
                                                                </template>
                                                            </div>
                                                            </template>
                                                            <span class="dub-htable__foot">{q.footer}</span>
                                                        </div>
                                                    </template>
                                                    <template lwc:else>
                                                    <div class={q.className} data-q={q.id} draggable="true" onclick={handleQuestionClick}
                                                        tabindex="0" role="button" aria-label={q.label} onkeydown={handleQuestionKey}
                                                        ondragstart={handleQuestionDragStart} ondragover={handleQuestionDragOver}
                                                        ondrop={handleDrop} ondragend={handleDragEnd}>
                                                        <span class="dub-q__grip" aria-hidden="true">⋮⋮</span>
                                                        <div class="dub-q__body">
                                                            <span class="dub-q__label">{q.label}<template if:true={q.isRequired}><span class="dub-req">*</span></template><template if:true={q.isNew}><span class="dub-new-tag">{q.newTag}</span></template><template if:true={q.incomplete}><span class="dub-warn-tag">{q.incompleteTag}</span></template><template if:true={q.isHidden}><span class="dub-hidden-tag">{q.hiddenTag}</span></template><template if:true={q.isReadOnly}><span class="dub-ro-tag">{q.readOnlyTag}</span></template></span>

                                                            <template if:true={q.isPlain}>
                                                                <div class="dub-q__related">

                                                            <span class="dub-q__tags"><span class={q.tagClass}>{q.tag}</span><template if:true={q.isHistorize}><span class="dub-tag dub-tag--history">{q.historyTag}</span></template></span>

                                                                title={i18n.builderMoveDown} aria-label={i18n.builderMoveDown}>↓</button>

                                                        </div>
                                                    </div>
                                                    </template>
                                                    <template if:true={q.dropAfter}><div class="dub-dropline"></div></template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <button type="button" class="dub-btn dub-btn--ghost dub-add-section" onclick={handleAddSection}>{i18n.builderNewSection}</button>
                                    <button type="button" class="dub-btn dub-btn--primary dub-paper__submit" tabindex="-1" disabled>{pv.btnSubmit}</button>
                                </template>
                            </div>
                        </div>
                    </div>
