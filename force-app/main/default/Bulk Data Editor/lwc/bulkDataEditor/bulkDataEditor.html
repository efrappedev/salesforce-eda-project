<template>
    <lightning-card title="Bulk Data Editor" icon-name="standard:data_mapping">
        <div slot="actions">
            <lightning-icon icon-name="utility:info" size="x-small" title="Mass update field values across records"></lightning-icon>
        </div>

        <div class="slds-p-horizontal_medium">
            <lightning-tabset variant="scoped" onactive={handleTabActive}>
                <lightning-tab label="Bulk Edit" value="edit" icon-name="utility:edit">

                    <template if:true={objectsError}>
                        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                            <span>{objectsError}</span>
                        </div>
                    </template>

                    <!-- Mode chooser: edit field values vs. change Record Type -->
                    <div class="slds-m-bottom_medium">
                        <lightning-radio-group
                            name="mode"
                            variant="label-hidden"
                            type="button"
                            options={modeOptions}
                            value={mode}
                            onchange={handleModeChange}
                        ></lightning-radio-group>
                    </div>

                    <template if:true={isRecordTypeMode}>
                        <c-bulk-record-type-change onrundone={handleRecordTypeRunDone}></c-bulk-record-type-change>
                    </template>

                    <template if:true={isValuesMode}>

                    <!-- Visual path indicator: hand-built (not slds-path) so
                         completed/current/future states are fully our own
                         colors — the native SLDS chevron paints part of its
                         shape on the <li> itself via ::before/::after, which
                         kept showing through no matter how the inner link
                         was overridden. See feedback_slds_path_no_force_color. -->
                    <ul class="step-path slds-m-bottom_medium" role="listbox">
                        <template for:each={pathSteps} for:item="step">
                            <li key={step.key} class="step-path__item" role="presentation">
                                <button
                                    type="button"
                                    class={step.chipClass}
                                    data-key={step.key}
                                    title={step.label}
                                    onclick={handlePathStepClick}
                                >
                                    <template if:true={step.isComplete}>
                                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Complete"></lightning-icon>
                                    </template>
                                    <template if:false={step.isComplete}>
                                        <span class="step-chip__label">{step.label}</span>
                                    </template>
                                </button>
                                <template if:false={step.isLast}>
                                    <lightning-icon icon-name="utility:chevronright" size="xx-small" class="step-path__connector"></lightning-icon>
                                </template>
                            </li>
                        </template>
                    </ul>

                    <div class={wizardContainerClass}>

                    <!-- Step 1: Object -->
                    <template if:true={isObjectStep}>
                        <div class="slds-box slds-m-bottom_medium wizard-step">
                            <p class="slds-text-title_bold slds-m-bottom_x-small">Step 1 — Choose an object</p>
                            <c-bulk-searchable-select
                                label="Object"
                                placeholder="Search objects..."
                                options={objectOptions}
                                value={selectedObjectApiName}
                                disabled={isLoadingObjects}
                                onchange={handleObjectChange}
                            ></c-bulk-searchable-select>
                        </div>
                    </template>

                    <!-- Step 2: Field -->
                    <template if:true={isFieldStep}>
                        <div class="slds-box slds-m-bottom_medium wizard-step">
                            <div class="wizard-step__header">
                                <lightning-button-icon
                                    icon-name="utility:back"
                                    alternative-text="Back"
                                    title="Back to object"
                                    variant="border-filled"
                                    size="small"
                                    class="slds-m-right_small"
                                    onclick={handleBackToObject}
                                ></lightning-button-icon>
                                <p class="slds-text-title_bold">Step 2 — Choose a field to mass-edit</p>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">Object: {selectedObjectLabel}</p>
                            <c-bulk-searchable-select
                                label="Field"
                                placeholder="Search fields..."
                                options={fieldOptions}
                                value={selectedFieldApiName}
                                disabled={isFieldSelectDisabled}
                                onchange={handleFieldChange}
                            ></c-bulk-searchable-select>
                            <template if:true={isLoadingFields}>
                                <lightning-spinner alternative-text="Loading fields" size="x-small"></lightning-spinner>
                            </template>
                        </div>
                    </template>

                    <!-- Step 3: Value distribution -->
                    <template if:true={isValueStep}>
                        <div class="slds-box slds-m-bottom_medium wizard-step">
                            <div class="wizard-step__header">
                                <lightning-button-icon
                                    icon-name="utility:back"
                                    alternative-text="Back"
                                    title="Back to field"
                                    variant="border-filled"
                                    size="small"
                                    class="slds-m-right_small"
                                    onclick={handleBackToField}
                                ></lightning-button-icon>
                                <p class="slds-text-title_bold">Step 3 — Pick the current value you want to replace</p>
                            </div>
                            <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">
                                {selectedObjectLabel} — {selectedFieldLabel}
                            </p>

                            <div class="step3-columns">
                                <!-- Column 1: optional cross-filter criterion -->
                                <div class="step3-col">
                                    <div class="step3-col__header">
                                        <lightning-icon icon-name="utility:filter" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span class="step3-col__title">1. Filter records <span class="step3-col__optional">(optional)</span></span>
                                    </div>
                                    <p class="step-hint slds-m-bottom_small">Only include records that also match another condition, e.g. Mailing State = Quebec.</p>
                                    <c-bulk-searchable-select
                                        label="Field"
                                        placeholder="Search fields..."
                                        options={filterFieldOptions}
                                        value={selectedFilterFieldApiName}
                                        disabled={isLoadingFilterFields}
                                        onchange={handleFilterFieldChange}
                                    ></c-bulk-searchable-select>

                                    <template if:true={selectedFilterFieldApiName}>
                                        <div class="step3-col__subheader slds-m-top_small slds-m-bottom_x-small">
                                            <p class="step-hint">Pick the value of <strong>{selectedFilterFieldLabel}</strong> to filter by.</p>
                                            <button type="button" class="clear-filter-link" onclick={handleRemoveFilter}>Clear</button>
                                        </div>
                                        <template if:true={isLoadingFilterDistribution}>
                                            <lightning-spinner alternative-text="Loading values" size="small"></lightning-spinner>
                                        </template>
                                        <template if:false={isLoadingFilterDistribution}>
                                            <template if:true={filterDistribution}>
                                                <c-bulk-value-table
                                                    buckets={filterDistribution.buckets}
                                                    is-picklist={filterDistribution.isPicklist}
                                                    selected-raw-value={selectedFilterRawValue}
                                                    selected-is-blank={selectedFilterIsBlank}
                                                    onselect={handleFilterValueSelect}
                                                ></c-bulk-value-table>
                                            </template>
                                        </template>
                                    </template>
                                </div>

                                <div class="step3-connector">
                                    <lightning-icon icon-name="utility:forward" size="x-small"></lightning-icon>
                                </div>

                                <!-- Column 2: the value to replace -->
                                <div class="step3-col">
                                    <div class="step3-col__header">
                                        <lightning-icon icon-name="utility:check" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                        <span class="step3-col__title">2. Pick the current value</span>
                                    </div>
                                    <p class="step-hint slds-m-bottom_small">Pick the current value of <strong>{selectedFieldLabel}</strong> you want to replace<template if:true={hasFilter}>, for the filtered records</template>.</p>

                                    <template if:true={isLoadingDistribution}>
                                        <lightning-spinner alternative-text="Loading values" size="small"></lightning-spinner>
                                    </template>
                                    <template if:false={isLoadingDistribution}>
                                        <template if:true={distribution}>
                                            <c-bulk-value-table
                                                buckets={distribution.buckets}
                                                is-picklist={selectedFieldIsPicklist}
                                                selected-raw-value={selectedBucketRawValue}
                                                selected-is-blank={selectedBucketIsBlank}
                                                onselect={handleBucketSelect}
                                            ></c-bulk-value-table>
                                        </template>
                                        <template if:false={distribution}>
                                            <div class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center">
                                                <p class="slds-text-body_regular">
                                                    Could not load values for this field. Try a different field.
                                                </p>
                                            </div>
                                        </template>
                                    </template>
                                </div>
                            </div>

                            <template if:true={showStep3Footer}>
                                <div class="step3-footer slds-m-top_medium">
                                    <p class="step3-footer__text">{step3StatusText}</p>
                                    <div class="step3-footer__actions">
                                        <lightning-button label="Cancel" variant="neutral" class="slds-m-right_x-small" onclick={handleCancelValueSelection}></lightning-button>
                                        <lightning-button label="Continue to Step 4" variant="brand" onclick={handleContinueToNewValue}></lightning-button>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>

                    <!-- Step 4: New value -->
                    <template if:true={isNewValueStep}>
                        <div class="slds-box slds-m-bottom_medium wizard-step">
                            <div class="wizard-step__header">
                                <lightning-button-icon
                                    icon-name="utility:back"
                                    alternative-text="Back"
                                    title="Back to value"
                                    variant="border-filled"
                                    size="small"
                                    class="slds-m-right_small"
                                    onclick={handleBackToValue}
                                ></lightning-button-icon>
                                <p class="slds-text-title_bold">Step 4 — Enter the new value</p>
                            </div>
                            <div class="slds-p-around_small selected-value-box slds-m-bottom_small">
                                <p class="slds-text-body_regular">This will change <strong>{selectedFieldLabel}</strong> from <strong>{oldValueDisplay}</strong> to the new value you enter below, for <strong>{affectedCount}</strong> {selectedObjectLabel} record(s)<template if:true={hasFilter}> where <strong>{selectedFilterFieldLabel}</strong> = <strong>{filterValueDisplay}</strong></template>.</p>
                            </div>

                            <template if:false={newValueIsBlank}>
                                <template if:true={selectedFieldIsPicklist}>
                                    <c-bulk-searchable-select
                                        label="New value"
                                        placeholder="Search picklist values..."
                                        options={picklistOptions}
                                        value={newValueInput}
                                        onchange={handleNewValueChange}
                                    ></c-bulk-searchable-select>
                                </template>
                                <template if:true={selectedFieldIsBoolean}>
                                    <lightning-combobox
                                        label="New value"
                                        placeholder="True or False"
                                        options={booleanOptions}
                                        value={newValueInput}
                                        onchange={handleNewValueChange}
                                    ></lightning-combobox>
                                </template>
                                <template if:true={selectedFieldIsDate}>
                                    <lightning-input type="date" label="New value" onchange={handleNewValueChange}></lightning-input>
                                </template>
                                <template if:true={selectedFieldIsNumeric}>
                                    <lightning-input type="number" step="0.01" label="New value" onchange={handleNewValueChange}></lightning-input>
                                </template>
                                <template if:true={selectedFieldIsText}>
                                    <lightning-input type="text" label="New value" value={newValueInput} onchange={handleNewValueChange}></lightning-input>
                                </template>
                            </template>

                            <lightning-input
                                type="checkbox"
                                label="Set field to blank instead"
                                class="slds-m-top_small"
                                onchange={handleNewValueBlankToggle}
                            ></lightning-input>

                            <lightning-button
                                label="Review &amp; apply"
                                variant="brand"
                                class="slds-m-top_medium"
                                disabled={confirmDisabled}
                                onclick={handleOpenConfirm}
                            ></lightning-button>
                        </div>
                    </template>

                    <!-- Step 5: Run progress -->
                    <template if:true={showProgress}>
                        <div class="slds-box">
                            <p class="slds-text-title_bold slds-m-bottom_x-small">Applying mass update...</p>
                            <c-bulk-edit-progress
                                data-role="run"
                                log-id={currentLogId}
                                ondone={handleRunDone}
                            ></c-bulk-edit-progress>

                            <template if:true={runSummary}>
                                <div class="slds-grid slds-m-top_medium">
                                    <lightning-button
                                        label="Start another edit"
                                        variant="brand"
                                        class="slds-m-right_small"
                                        onclick={handleStartAnother}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Start over"
                                        variant="neutral"
                                        onclick={handleStartOver}
                                    ></lightning-button>
                                </div>
                            </template>
                        </div>
                    </template>

                    </div>

                    </template>

                </lightning-tab>

                <lightning-tab label="Paste Update" value="pasteupdate" icon-name="utility:paste">
                    <c-bulk-paste-update onrundone={handlePasteUpdateRunDone}></c-bulk-paste-update>
                </lightning-tab>

                <lightning-tab label="Regenerate ID" value="regenerateid" icon-name="utility:refresh">
                    <c-bulk-regenerate-id onrundone={handleRegenerateIdRunDone}></c-bulk-regenerate-id>
                </lightning-tab>

                <lightning-tab label="Clean Field" value="cleanfield" icon-name="utility:clear">
                    <c-bulk-clean-field onrundone={handleCleanFieldRunDone}></c-bulk-clean-field>
                </lightning-tab>

                <lightning-tab label="History" value="history" icon-name="utility:history">
                    <c-bulk-edit-history></c-bulk-edit-history>
                </lightning-tab>
            </lightning-tabset>
        </div>

        <template if:true={showConfirmModal}>
            <c-bulk-edit-confirm-modal
                object-label={selectedObjectLabel}
                field-label={selectedFieldLabel}
                old-value-display={oldValueDisplay}
                new-value-display={newValueDisplay}
                affected-count={affectedCount}
                filter-field-label={selectedFilterFieldLabel}
                filter-value-display={filterValueDisplay}
                oncancel={handleCancelConfirm}
                onconfirm={handleConfirmRun}
            ></c-bulk-edit-confirm-modal>
        </template>
    </lightning-card>
</template>
