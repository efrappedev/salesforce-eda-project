<template>
    <!-- Visual path indicator: hand-built (not slds-path) — same note as
         bulkDataEditor.html / feedback_slds_path_no_force_color. -->
    <ul class="step-path slds-m-bottom_medium" role="listbox">
        <template for:each={pathSteps} for:item="step">
            <li key={step.key} class="step-path__item" role="presentation">
                <button
                    type="button"
                    class={step.chipClass}
                    data-key={step.key}
                    title={step.label}
                    onclick={handlePathStepClick}
                >
                    <template if:true={step.isComplete}>
                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Complete"></lightning-icon>
                    </template>
                    <template if:false={step.isComplete}>
                        <span class="step-chip__label">{step.label}</span>
                    </template>
                </button>
                <template if:false={step.isLast}>
                    <lightning-icon icon-name="utility:chevronright" size="xx-small" class="step-path__connector"></lightning-icon>
                </template>
            </li>
        </template>
    </ul>

    <div class="cf-container">

        <template if:true={loadError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                <span>{loadError}</span>
            </div>
        </template>
        <template if:true={previewError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                <span>{previewError}</span>
            </div>
        </template>

        <!-- Step: object -->
        <template if:true={isObjectStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <p class="slds-text-title_bold slds-m-bottom_x-small">Step 1 — Choose an object</p>
                <c-bulk-searchable-select
                    label="Object"
                    placeholder="Search objects..."
                    options={objectOptions}
                    value={selectedObjectApiName}
                    disabled={isLoadingObjects}
                    onchange={handleObjectChange}
                ></c-bulk-searchable-select>
            </div>
        </template>

        <!-- Step: field -->
        <template if:true={isFieldStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to object"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToObject}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 2 — Choose the field to clean</p>
                </div>
                <p class="step-hint slds-m-bottom_small">
                    Object: {selectedObjectLabel}. Only text-like fields (text, phone, email, URL) are shown — these are
                    the field types that can carry stray whitespace or special characters.
                </p>
                <c-bulk-searchable-select
                    label="Field"
                    placeholder="Search fields..."
                    options={fieldOptions}
                    value={selectedFieldApiName}
                    disabled={isLoadingFields}
                    onchange={handleFieldChange}
                ></c-bulk-searchable-select>
                <template if:true={isLoadingFields}>
                    <lightning-spinner alternative-text="Loading fields" size="x-small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step: filter (optional) -->
        <template if:true={isFilterStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to field"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToField}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 3 — Filter records (optional)</p>
                </div>
                <p class="step-hint slds-m-bottom_small">
                    {selectedObjectLabel} — {selectedFieldLabel}. Only include records that also match another condition,
                    e.g. Mailing State = Quebec. Leave this empty to clean every record with a value in this field.
                </p>

                <c-bulk-searchable-select
                    label="Filter field"
                    placeholder="Search fields..."
                    options={filterFieldOptions}
                    value={selectedFilterFieldApiName}
                    disabled={isLoadingFilterFields}
                    onchange={handleFilterFieldChange}
                ></c-bulk-searchable-select>

                <template if:true={selectedFilterFieldApiName}>
                    <div class="cf-filter-subheader slds-m-top_small slds-m-bottom_x-small">
                        <p class="step-hint">Pick the value of <strong>{selectedFilterFieldLabel}</strong> to filter by.</p>
                        <button type="button" class="clear-filter-link" onclick={handleRemoveFilter}>Clear</button>
                    </div>
                    <template if:true={isLoadingFilterDistribution}>
                        <lightning-spinner alternative-text="Loading values" size="small"></lightning-spinner>
                    </template>
                    <template if:false={isLoadingFilterDistribution}>
                        <template if:true={filterDistribution}>
                            <c-bulk-value-table
                                buckets={filterDistribution.buckets}
                                is-picklist={filterDistribution.isPicklist}
                                selected-raw-value={selectedFilterRawValue}
                                selected-is-blank={selectedFilterIsBlank}
                                onselect={handleFilterValueSelect}
                            ></c-bulk-value-table>
                        </template>
                    </template>
                </template>

                <lightning-button
                    label="Continue to Step 4"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleContinueToRules}
                ></lightning-button>
            </div>
        </template>

        <!-- Step: rules -->
        <template if:true={isRulesStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to filter"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToFilter}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 4 — Choose cleaning rules</p>
                </div>
                <p class="step-hint slds-m-bottom_small">
                    {selectedObjectLabel} — {selectedFieldLabel}<template if:true={hasFilter}>, filtered where <strong>{selectedFilterFieldLabel}</strong> = <strong>{filterValueDisplay}</strong></template>.
                    Each record's own current value is read directly from Salesforce and cleaned in place — nothing is pasted or typed in.
                </p>

                <lightning-input
                    type="checkbox"
                    label="Normalize invisible/odd spaces (narrow no-break space, non-breaking space, ideographic space, tabs, zero-width characters)"
                    checked={normalizeSpaces}
                    onchange={handleNormalizeSpacesToggle}
                    class="slds-m-bottom_small"
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Collapse repeated spaces into one"
                    checked={collapseSpaces}
                    onchange={handleCollapseSpacesToggle}
                    class="slds-m-bottom_small"
                ></lightning-input>
                <lightning-input
                    type="checkbox"
                    label="Trim leading/trailing spaces"
                    checked={trimEdges}
                    onchange={handleTrimEdgesToggle}
                    class="slds-m-bottom_small"
                ></lightning-input>

                <lightning-input
                    type="checkbox"
                    label="Also remove specific characters or words"
                    checked={removeCustomText}
                    onchange={handleRemoveCustomTextToggle}
                    class="slds-m-bottom_x-small"
                ></lightning-input>
                <lightning-input
                    type="text"
                    label="Text to remove (comma-separated, optional)"
                    placeholder="!, @, #, (older), (old)"
                    value={customCharsToStrip}
                    disabled={customTextInputDisabled}
                    onchange={handleCustomCharsChange}
                    field-level-help="Check the box above to enable this. Separate each item with a comma — a single character (!) or a whole word/phrase ((older)) both work the same way: removed wherever that exact text appears. It deletes, it does not replace with anything else (no comma, no dash, etc). To remove a space character you can't type directly (like the French narrow space), copy it from an actual record's value and paste it here as one of the comma-separated items."
                    class="slds-m-bottom_small"
                ></lightning-input>

                <template if:true={noRulesSelected}>
                    <p class="cf-warning-text slds-m-bottom_small">Select at least one rule to see a preview.</p>
                </template>

                <lightning-button
                    label="Preview changes"
                    variant="brand"
                    disabled={noRulesSelected}
                    onclick={handleRunPreview}
                ></lightning-button>
                <template if:true={isLoadingPreview}>
                    <lightning-spinner alternative-text="Loading preview" size="x-small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step: preview -->
        <template if:true={isPreviewStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to rules"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToRules}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 5 — Preview</p>
                </div>
                <p class="step-hint slds-m-bottom_small">{selectedObjectLabel} — {selectedFieldLabel}. Rules: {rulesSummary}</p>

                <div class="cf-preview-summary slds-m-bottom_medium">
                    <p>{previewSampleText}</p>
                    <p class="cf-preview-note slds-m-top_x-small">
                        <lightning-icon icon-name="utility:info" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
                        <span>This preview only samples up to 200 records to show you examples. Running the cleanup always scans and cleans every matching record in the field — there is no cap on the actual run.</span>
                    </p>
                </div>

                <template if:true={previewHasChanges}>
                    <div class="cf-datatable-wrap">
                        <lightning-datatable
                            key-field="recordId"
                            data={previewChangedRows}
                            columns={previewColumns}
                            hide-checkbox-column="true"
                        ></lightning-datatable>
                    </div>
                </template>
                <template if:false={previewHasChanges}>
                    <div class="slds-illustration slds-illustration_small slds-p-around_medium slds-text-align_center">
                        <p class="slds-text-body_regular">No changes found in the sample scanned. If you still want to run this against the full matching set, use Run cleanup below.</p>
                    </div>
                </template>

                <lightning-button
                    label="Run cleanup"
                    variant="brand"
                    class="slds-m-top_medium"
                    onclick={handleOpenConfirm}
                ></lightning-button>
            </div>
        </template>

        <!-- Step: run -->
        <template if:true={showProgress}>
            <div class="slds-box">
                <p class="slds-text-title_bold slds-m-bottom_x-small">Applying cleanup...</p>
                <c-bulk-edit-progress
                    data-role="run"
                    log-id={currentLogId}
                    ondone={handleRunDone}
                ></c-bulk-edit-progress>

                <template if:true={runSummary}>
                    <div class="slds-grid slds-m-top_medium">
                        <lightning-button
                            label="Start another cleanup"
                            variant="brand"
                            class="slds-m-right_small"
                            onclick={handleStartAnother}
                        ></lightning-button>
                        <lightning-button
                            label="Start over"
                            variant="neutral"
                            onclick={handleStartOver}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </template>

    </div>

    <template if:true={showConfirmModal}>
        <c-bulk-edit-confirm-modal
            object-label={selectedObjectLabel}
            field-label={selectedFieldLabel}
            old-value-display="(varies per record)"
            new-value-display={rulesSummary}
            affected-count={previewAffectedCount}
            filter-field-label={selectedFilterFieldLabel}
            filter-value-display={filterValueDisplay}
            oncancel={handleCancelConfirm}
            onconfirm={handleConfirmRun}
        ></c-bulk-edit-confirm-modal>
    </template>
</template>
