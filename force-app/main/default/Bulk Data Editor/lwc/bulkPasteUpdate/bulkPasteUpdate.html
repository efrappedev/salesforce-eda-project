<template>
    <!-- Visual path indicator: hand-built (not slds-path) — see the same
         note in bulkDataEditor.html / feedback_slds_path_no_force_color.
         Kept OUTSIDE the width-capped container below (same pattern as
         bulkDataEditor.html) so it always has the full tab width to lay
         out on one row instead of wrapping when the current step's label
         is long. -->
    <ul class="step-path slds-m-bottom_medium" role="listbox">
        <template for:each={pathSteps} for:item="step">
            <li key={step.key} class="step-path__item" role="presentation">
                <button
                    type="button"
                    class={step.chipClass}
                    data-key={step.key}
                    title={step.label}
                    onclick={handlePathStepClick}
                >
                    <template if:true={step.isComplete}>
                        <lightning-icon icon-name="utility:check" size="xx-small" variant="inverse" alternative-text="Complete"></lightning-icon>
                    </template>
                    <template if:false={step.isComplete}>
                        <span class="step-chip__label">{step.label}</span>
                    </template>
                </button>
                <template if:false={step.isLast}>
                    <lightning-icon icon-name="utility:chevronright" size="xx-small" class="step-path__connector"></lightning-icon>
                </template>
            </li>
        </template>
    </ul>

    <div class={containerClass}>

        <template if:true={loadError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                <span>{loadError}</span>
            </div>
        </template>
        <template if:true={matchError}>
            <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error slds-m-bottom_medium" role="alert">
                <span>{matchError}</span>
            </div>
        </template>

        <!-- Step: object -->
        <template if:true={isObjectStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <p class="slds-text-title_bold slds-m-bottom_x-small">Step 1 — Choose an object</p>
                <c-bulk-searchable-select
                    label="Object"
                    placeholder="Search objects..."
                    options={objectOptions}
                    value={selectedObjectApiName}
                    disabled={isLoadingObjects}
                    onchange={handleObjectChange}
                ></c-bulk-searchable-select>
            </div>
        </template>

        <!-- Step: search field -->
        <template if:true={isSearchFieldStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to object"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToObject}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 2 — Choose the field to search by</p>
                </div>
                <p class="step-hint slds-m-bottom_small">
                    Object: {selectedObjectLabel}. This is the field your pasted list of values will be matched against
                    (e.g. an external ID field), or "Record ID (Salesforce)" if you're pasting raw Salesforce Ids.
                </p>
                <c-bulk-searchable-select
                    label="Search by field"
                    placeholder="Search fields..."
                    options={searchFieldOptions}
                    value={selectedSearchFieldApiName}
                    disabled={isLoadingSearchFields}
                    onchange={handleSearchFieldChange}
                ></c-bulk-searchable-select>
                <template if:true={isLoadingSearchFields}>
                    <lightning-spinner alternative-text="Loading fields" size="x-small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step: field to change -->
        <template if:true={isFieldStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to search field"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToSearchField}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 3 — Choose the field to change</p>
                </div>
                <p class="step-hint slds-m-bottom_small">Object: {selectedObjectLabel}. Search field: {selectedSearchFieldLabel}.</p>
                <c-bulk-searchable-select
                    label="Field to change"
                    placeholder="Search fields..."
                    options={fieldOptions}
                    value={selectedFieldApiName}
                    disabled={isLoadingFields}
                    onchange={handleFieldChange}
                ></c-bulk-searchable-select>
                <template if:true={isLoadingFields}>
                    <lightning-spinner alternative-text="Loading fields" size="x-small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step: paste -->
        <template if:true={isPasteStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to field"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToField}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 4 — Paste the values to match, and the new value</p>
                </div>
                <p class="step-hint slds-m-bottom_small">
                    {selectedObjectLabel} — matching by {selectedSearchFieldLabel}, changing {selectedFieldLabel}.
                </p>

                <!-- Both mode toggles live together at the top, same row, so
                     it's clear they're the two things controlling what the
                     right-hand column looks like below — not buried inside
                     the paste columns themselves. -->
                <div class="pu-toggle-row slds-m-bottom_small">
                    <lightning-input
                        type="checkbox"
                        label="Use the same new value for every matched record"
                        checked={useSameValue}
                        onchange={handleUseSameValueToggle}
                    ></lightning-input>
                    <lightning-helptext
                        content="Checked: apply one same new value (or blank) to every matched record. Unchecked: paste one distinct new value per line on the right, in the same order as the values to search for on the left."
                    ></lightning-helptext>

                    <template if:true={useSameValue}>
                        <lightning-input
                            type="checkbox"
                            label="Set field to blank instead"
                            checked={uniformNewValueIsBlank}
                            onchange={handleUniformBlankToggle}
                        ></lightning-input>
                    </template>
                </div>

                <!-- Side-by-side columns so pasted rows line up visually,
                     like a comparison table: values to search for on the
                     left, the new value(s) on the right — kept as two
                     columns even in "same value for all" mode, so the
                     layout never jumps between steps. -->
                <div class="pu-paste-columns">
                    <div class="pu-paste-col">
                        <lightning-textarea
                            label={searchColumnLabel}
                            placeholder="Paste one value per line..."
                            value={pasteSearchValues}
                            onchange={handleSearchValuesChange}
                        ></lightning-textarea>
                    </div>

                    <div class="pu-paste-col">
                        <template if:false={useSameValue}>
                            <lightning-textarea
                                label={newColumnLabel}
                                placeholder="Paste one new value per line, in the same order..."
                                value={pasteNewValues}
                                onchange={handleNewValuesChange}
                            ></lightning-textarea>
                            <template if:true={lineCountMismatch}>
                                <p class="pu-error-text slds-m-top_x-small">
                                    The number of new values must match the number of values to search for.
                                </p>
                            </template>
                        </template>

                        <template if:true={useSameValue}>
                            <template if:false={uniformNewValueIsBlank}>
                                <template if:true={selectedFieldIsPicklist}>
                                    <c-bulk-searchable-select
                                        label="New value"
                                        placeholder="Search picklist values..."
                                        options={picklistOptions}
                                        value={uniformNewValueInput}
                                        onchange={handleUniformValueChange}
                                    ></c-bulk-searchable-select>
                                </template>
                                <template if:true={selectedFieldIsBoolean}>
                                    <lightning-combobox
                                        label="New value"
                                        placeholder="True or False"
                                        options={booleanOptions}
                                        value={uniformNewValueInput}
                                        onchange={handleUniformValueChange}
                                    ></lightning-combobox>
                                </template>
                                <template if:true={selectedFieldIsDate}>
                                    <lightning-input type="date" label="New value" onchange={handleUniformValueChange}></lightning-input>
                                </template>
                                <template if:true={selectedFieldIsNumeric}>
                                    <lightning-input type="number" step="0.01" label="New value" onchange={handleUniformValueChange}></lightning-input>
                                </template>
                                <template if:true={selectedFieldIsText}>
                                    <lightning-input type="text" label="New value" value={uniformNewValueInput} onchange={handleUniformValueChange}></lightning-input>
                                </template>
                            </template>
                        </template>
                    </div>
                </div>

                <lightning-button
                    label="Match records"
                    variant="brand"
                    class="slds-m-top_medium"
                    disabled={matchDisabled}
                    onclick={handleMatch}
                ></lightning-button>
                <template if:true={isMatching}>
                    <lightning-spinner alternative-text="Matching" size="x-small"></lightning-spinner>
                </template>
            </div>
        </template>

        <!-- Step: match & review -->
        <template if:true={isMatchStep}>
            <div class="slds-box slds-m-bottom_medium wizard-step">
                <div class="wizard-step__header">
                    <lightning-button-icon
                        icon-name="utility:back"
                        alternative-text="Back"
                        title="Back to paste"
                        variant="border-filled"
                        size="small"
                        class="slds-m-right_small"
                        onclick={handleBackToPaste}
                    ></lightning-button-icon>
                    <p class="slds-text-title_bold">Step 5 — Review matches</p>
                </div>

                <template if:true={hasUnmatchedRows}>
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_warning slds-m-bottom_small" role="alert">
                        <span>{excludedCount} value(s) were not found, or matched more than one record — shown at the top of the table below, they will be excluded from the run.</span>
                    </div>
                </template>

                <div class="pu-datatable-wrap">
                    <lightning-datatable
                        key-field="searchValue"
                        data={matchResults}
                        columns={columns}
                        hide-checkbox-column="true"
                    ></lightning-datatable>
                </div>

                <div class="pu-match-footer slds-m-top_medium">
                    <p class="pu-match-footer__text">{matchedCount} of {matchResults.length} will be updated</p>
                    <lightning-button
                        label="Review &amp; apply"
                        variant="brand"
                        disabled={confirmDisabled}
                        onclick={handleOpenConfirm}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <!-- Step: run -->
        <template if:true={showProgress}>
            <div class="slds-box">
                <p class="slds-text-title_bold slds-m-bottom_x-small">Applying update...</p>
                <c-bulk-edit-progress
                    data-role="run"
                    log-id={currentLogId}
                    ondone={handleRunDone}
                ></c-bulk-edit-progress>

                <template if:true={runSummary}>
                    <div class="slds-grid slds-m-top_medium">
                        <lightning-button
                            label="Start another paste update"
                            variant="brand"
                            class="slds-m-right_small"
                            onclick={handleStartAnother}
                        ></lightning-button>
                        <lightning-button
                            label="Start over"
                            variant="neutral"
                            onclick={handleStartOver}
                        ></lightning-button>
                    </div>
                </template>
            </div>
        </template>

    </div>

    <template if:true={showConfirmModal}>
        <c-bulk-edit-confirm-modal
            object-label={selectedObjectLabel}
            field-label={selectedFieldLabel}
            old-value-display="(varies per record)"
            new-value-display={newValueDisplaySummary}
            affected-count={matchedCount}
            oncancel={handleCancelConfirm}
            onconfirm={handleConfirmRun}
        ></c-bulk-edit-confirm-modal>
    </template>
</template>
