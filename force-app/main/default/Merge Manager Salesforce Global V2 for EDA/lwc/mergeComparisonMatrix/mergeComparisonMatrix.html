<template>
    <div class="matrix-wrapper">

        <!-- ── Comparison table ─────────────────────────────────────────────── -->
        <div class="matrix-scroll slds-scrollable_x">
            <table class="matrix-table slds-table slds-table_bordered slds-table_cell-buffer">

                <!-- THEAD: master selector row -->
                <thead>
                    <tr class="matrix-table__header-row">
                        <!-- Field label column -->
                        <th class="matrix-table__label-col" scope="col">
                            <div class="slds-text-body_small slds-text-color_weak">
                                {i18n.labelMainRecord}
                                <lightning-helptext
                                    content={i18n.helpMasterSelect}
                                    class="slds-m-left_xx-small">
                                </lightning-helptext>
                            </div>
                        </th>
                        <!-- One header per candidate -->
                        <template for:each={columns} for:item="col">
                            <th key={col.recordId} class={col.headerClass} scope="col">
                                <div class="slds-text-align_center">
                                    <!-- Master radio selector -->
                                    <label class="matrix-master-radio">
                                        <input
                                            type="radio"
                                            name="master-select"
                                            value={col.recordId}
                                            checked={col.isMaster}
                                            onchange={handleMasterChange}
                                            class="slds-assistive-text">
                                        <span class="matrix-master-radio__faux"></span>
                                    </label>
                                    <!-- Record name -->
                                    <p class="slds-text-heading_small slds-truncate slds-m-top_x-small"
                                        title={col.recordName}>
                                        {col.recordName}
                                    </p>
                                    <!-- Master badge -->
                                    <template if:true={col.isMaster}>
                                        <span class="slds-badge slds-badge_success slds-m-top_xx-small">
                                            {i18n.matMasterBadge}
                                        </span>
                                    </template>
                                    <!-- Active enrollments warning -->
                                    <template if:true={col.hasActiveEnrollments}>
                                        <span class="slds-badge badge-warning slds-m-top_xx-small">
                                            <lightning-icon icon-name="utility:warning"
                                                size="xx-small" class="slds-m-right_xx-small">
                                            </lightning-icon>
                                            {i18n.activeEnrollments}
                                        </span>
                                    </template>
                                </div>
                            </th>
                        </template>
                    </tr>
                </thead>

                <!-- TBODY: field rows -->
                <tbody>
                    <template for:each={tableRows} for:item="row">
                        <tr key={row.fieldApiName} class={row.rowClass}>
                            <!-- Field label -->
                            <td class="matrix-table__label-col">
                                <div class="slds-grid slds-grid_vertical-align-center">
                                    <span class="slds-text-body_small matrix-field-label">{row.fieldLabel}</span>
                                    <template if:true={row.isEdaField}>
                                        <span class="slds-badge badge-eda slds-m-left_x-small">EDA</span>
                                    </template>
                                    <!-- Conflict warning only on selectable (updateable) rows -->
                                    <template if:true={row.hasConflict}>
                                        <lightning-icon icon-name="utility:warning"
                                            size="xx-small"
                                            class="slds-m-left_x-small conflict-icon"
                                            title={i18n.conflictTitle}>
                                        </lightning-icon>
                                    </template>
                                    <!-- Lock badge for read-only / non-updateable fields -->
                                    <template if:true={row.isReadOnly}>
                                        <span class="slds-badge badge-readonly slds-m-left_x-small"
                                            title={i18n.readOnlyTitle}>
                                            <lightning-icon icon-name="utility:lock"
                                                size="xx-small" class="slds-m-right_xx-small">
                                            </lightning-icon>{i18n.readOnlyLabel}
                                        </span>
                                    </template>
                                </div>
                            </td>
                            <!-- Value cells -->
                            <template for:each={row.cells} for:item="cell">
                                <td key={cell.recordId} class={cell.cellClass}>
                                    <!-- Read-only: plain value, no radio -->
                                    <template if:true={row.isReadOnly}>
                                        <span class="matrix-cell-value matrix-cell-value_readonly">
                                            {cell.displayValue}
                                        </span>
                                    </template>
                                    <!-- Updateable: radio selector -->
                                    <template if:false={row.isReadOnly}>
                                        <template if:true={cell.isNormalCell}>
                                            <label class="matrix-cell-label">
                                                <input
                                                    type="radio"
                                                    name={row.radioGroupName}
                                                    value={cell.recordId}
                                                    checked={cell.isSelected}
                                                    data-field={row.fieldApiName}
                                                    onchange={handleFieldDecisionChange}
                                                    class="slds-assistive-text">
                                                <span class="matrix-cell-radio__faux"></span>
                                                <span class="matrix-cell-value">{cell.displayValue}</span>
                                            </label>
                                            <!-- Value rescued from a duplicate, pending write into this empty field -->
                                            <template if:true={cell.pendingRescue}>
                                                <div class="rescue-pending" title={i18n.rescuePending}>
                                                    <lightning-icon icon-name="utility:level_down" size="xx-small"
                                                        class="rescue-pending__icon"></lightning-icon>
                                                    <span>{cell.pendingRescue}</span>
                                                </div>
                                            </template>
                                        </template>
                                        <!-- Loser email cell: the email itself is the picklist -->
                                        <template if:true={cell.isRescueCell}>
                                            <div class="rescue-cell">
                                                <button type="button" class={row.rescueInfo.dotClass}
                                                    data-sourcefield={row.fieldApiName}
                                                    data-loserid={row.rescueInfo.loserId}
                                                    aria-label={i18n.rescueOverwrite}
                                                    title={i18n.rescueOverwrite}
                                                    onclick={handleRescueDot}></button>
                                                <button type="button" class={row.rescueInfo.btnClass}
                                                    data-sourcefield={row.fieldApiName}
                                                    data-optcount={row.rescueInfo.optCount}
                                                    aria-haspopup="true"
                                                    aria-expanded={row.rescueInfo.ariaExpanded}
                                                    onclick={handleRescueToggle}>
                                                    <span class="rescue-drop__text">{cell.displayValue}</span>
                                                    <lightning-icon icon-name="utility:chevrondown" size="xx-small"
                                                        class="rescue-drop__chevron"></lightning-icon>
                                                </button>
                                                <template if:true={row.rescueInfo.needsAction}>
                                                    <span class="rescue-flag">{i18n.rescueDifferent}</span>
                                                </template>
                                            </div>
                                            <!-- Floating menu: position fixed, does not change row height -->
                                            <template if:true={row.rescueInfo.isOpen}>
                                                <div class="rescue-menu" style={row.rescueInfo.menuStyle}
                                                    role="menu" onkeydown={handleRescueMenuKeydown}>
                                                    <template for:each={row.rescueInfo.options} for:item="opt">
                                                        <button key={opt.key} type="button" role="menuitemradio"
                                                            class="rescue-menu__item"
                                                            aria-checked={opt.ariaChecked}
                                                            data-value={opt.value}
                                                            data-sourcefield={row.fieldApiName}
                                                            data-loserid={row.rescueInfo.loserId}
                                                            onclick={handleRescuePick}>
                                                            <span class="rescue-menu__check">
                                                                <template if:true={opt.selected}>
                                                                    <lightning-icon icon-name="utility:check" size="xx-small"
                                                                        class="rescue-menu__check-icon"></lightning-icon>
                                                                </template>
                                                            </span>
                                                            <span>{opt.label}</span>
                                                        </button>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                    </template>
                                </td>
                            </template>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>

        <!-- ── Related Account section (Contact merges, EDA) ───────────────── -->
        <template if:true={showRelatedAccountSection}>
            <div class="related-contacts-section slds-border_top slds-p-around_medium slds-m-top_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="standard:account" size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    {i18n.relAccountTitle}
                </h3>
                <div class="slds-grid slds-gutters slds-wrap">
                    <template for:each={relatedAccountColumns} for:item="col">
                        <div key={col.recordId} class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-2 slds-p-bottom_small">
                            <div class={col.colHeaderClass}>
                                <div class="slds-grid slds-grid_vertical-align-center
                                    slds-m-bottom_x-small">
                                    <p class="slds-text-body_small slds-col">
                                        <strong>{col.recordName}</strong>
                                    </p>
                                    <template if:true={col.isMaster}>
                                        <span class="slds-badge slds-badge_success">{i18n.matMasterBadge}</span>
                                    </template>
                                </div>
                                <template if:true={col.hasAccount}>
                                    <div class="slds-grid slds-grid_vertical-align-center
                                        related-contact-name-row">
                                        <lightning-icon icon-name="standard:account"
                                            size="xx-small" class="slds-m-right_xx-small">
                                        </lightning-icon>
                                        <span class="slds-text-body_small slds-col slds-truncate">
                                            {col.accountName}
                                        </span>
                                    </div>
                                    <template if:true={col.hasCarousel}>
                                        <c-merge-related-carousel
                                            items={col.carouselItems}
                                            lang={lang}>
                                        </c-merge-related-carousel>
                                    </template>
                                </template>
                                <template if:false={col.hasAccount}>
                                    <span class="slds-text-body_small slds-text-color_weak">—</span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- ── Related Contacts section (Account merges) ────────────────────── -->
        <template if:true={showRelatedContactsSection}>
            <div class="related-contacts-section slds-border_top slds-p-around_medium slds-m-top_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">
                    <lightning-icon icon-name="standard:contact" size="x-small"
                        class="slds-m-right_x-small">
                    </lightning-icon>
                    {i18n.relContactsTitle}
                </h3>
                <div class="slds-grid slds-gutters slds-wrap">
                    <template for:each={relatedContactColumns} for:item="col">
                        <div key={col.recordId} class="slds-col slds-size_1-of-1
                            slds-medium-size_1-of-2 slds-p-bottom_small">
                            <div class={col.colHeaderClass}>
                                <div class="slds-grid slds-grid_vertical-align-center
                                    slds-m-bottom_x-small">
                                    <p class="slds-text-body_small slds-col">
                                        <strong>{col.recordName}</strong>
                                    </p>
                                    <template if:true={col.isMaster}>
                                        <span class="slds-badge slds-badge_success">{i18n.matMasterBadge}</span>
                                    </template>
                                    <span class="slds-badge slds-m-left_x-small
                                        related-contacts-count">
                                        {col.contactCount} {i18n.labelContacts}
                                    </span>
                                </div>

                                <template if:true={col.activeCount}>
                                    <div class="slds-notify related-contacts-active-alert
                                        slds-m-bottom_x-small" role="alert">
                                        <lightning-icon icon-name="utility:warning"
                                            size="xx-small" class="slds-m-right_xx-small">
                                        </lightning-icon>
                                        <small>{col.activeCount} {i18n.activeContactsMsg}</small>
                                    </div>
                                </template>

                                <template for:each={col.contacts} for:item="c">
                                    <div key={c.contactId} class={c.rowClass}>
                                        <div class="slds-grid slds-grid_vertical-align-center
                                            related-contact-name-row">
                                            <lightning-icon icon-name="standard:contact"
                                                size="xx-small" class="slds-m-right_xx-small">
                                            </lightning-icon>
                                            <span class="slds-text-body_small slds-col slds-truncate">
                                                {c.contactName}
                                            </span>
                                            <template if:true={c.hasActive}>
                                                <lightning-icon icon-name="utility:warning"
                                                    size="xx-small"
                                                    class="slds-m-left_xx-small"
                                                    title={i18n.activeEnrollments}>
                                                </lightning-icon>
                                            </template>
                                        </div>
                                        <template if:true={c.hasCarousel}>
                                            <c-merge-related-carousel
                                                items={c.carouselItems}
                                                lang={lang}>
                                            </c-merge-related-carousel>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

    </div>
</template>
