<template>
    <section role="dialog" tabindex="-1"
        class="slds-modal slds-fade-in-open"
        aria-modal="true" aria-label={i18n.configTitle}>

        <div class="slds-modal__container">

            <!-- Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                    title={i18n.close} onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" size="small"
                        alternative-text={i18n.close}></lightning-icon>
                </button>
                <lightning-icon icon-name="utility:settings" size="x-small"
                    class="cfg-header-icon"></lightning-icon>
                <h2 class="slds-text-heading_medium" style="display:inline;vertical-align:middle">
                    {i18n.configTitle}
                </h2>
            </header>

            <!-- Two-column body -->
            <div class="slds-modal__content settings-layout">

                <!-- Left nav -->
                <nav class="settings-nav">
                    <button class={navItemLanguageClass} data-section="language" onclick={handleSectionChange}>
                        <lightning-icon icon-name="utility:world" size="x-small"
                            class="settings-nav__icon" alternative-text={i18n.settingsNavLanguage}>
                        </lightning-icon>
                        <span>{i18n.settingsNavLanguage}</span>
                    </button>
                    <button class={navItemObjectsClass} data-section="objects" onclick={handleSectionChange}>
                        <lightning-icon icon-name="utility:standard_objects" size="x-small"
                            class="settings-nav__icon" alternative-text={i18n.settingsNavObjects}>
                        </lightning-icon>
                        <span>{i18n.settingsNavObjects}</span>
                    </button>
                    <button class={navItemReasonsClass} data-section="reasons" onclick={handleSectionChange}>
                        <lightning-icon icon-name="utility:list" size="x-small"
                            class="settings-nav__icon" alternative-text={i18n.settingsNavReasons}>
                        </lightning-icon>
                        <span>{i18n.settingsNavReasons}</span>
                    </button>
                </nav>

                <!-- Right panel -->
                <div class="settings-panel">

                    <!-- ── Language ── -->
                    <template if:true={isLanguageSection}>
                        <div class="settings-panel__content">
                            <h3 class="settings-panel__title">{i18n.settingsNavLanguage}</h3>
                            <p class="settings-panel__hint slds-m-bottom_small">{i18n.settingsLang}</p>
                            <div class="cfg-lang-toggle">
                                <button class={langFrClass} data-lang="fr" onclick={handleLangChange}>FR</button>
                                <button class={langEnClass} data-lang="en" onclick={handleLangChange}>EN</button>
                                <button class={langEsClass} data-lang="es" onclick={handleLangChange}>ES</button>
                            </div>
                        </div>
                    </template>

                    <!-- ── Objects ── -->
                    <template if:true={isObjectsSection}>
                        <div class="settings-panel__content">
                            <!-- Type toggle — Account first for non-EDA orgs -->
                            <div class="cfg-type-toggle slds-m-bottom_x-small">
                                <button class={accountTabClass} data-type="Account" onclick={handleTypeChange}>
                                    {i18n.objectTypeAccount}
                                </button>
                                <button class={contactTabClass} data-type="Contact" onclick={handleTypeChange}>
                                    {i18n.objectTypeContact}
                                </button>
                            </div>

                            <template if:true={isLoading}>
                                <div class="slds-text-align_center slds-p-around_medium">
                                    <lightning-spinner size="small" alternative-text={i18n.loading}></lightning-spinner>
                                    <p class="slds-text-body_small slds-text-color_weak slds-m-top_small">{i18n.loadingOrg}</p>
                                </div>
                            </template>

                            <template if:true={errorMessage}>
                                <div class="cfg-error slds-m-bottom_small">{errorMessage}</div>
                            </template>

                            <template if:false={isLoading}>
                                <template if:true={hasItems}>
                                    <div class="cfg-header-row slds-m-bottom_xx-small">
                                        <p class="slds-text-body_small slds-text-color_weak">
                                            {itemsFoundLabel} — {i18n.configHint}
                                        </p>
                                        <div class="cfg-bulk-btns">
                                            <button class="slds-button slds-button_neutral cfg-bulk-btn"
                                                onclick={handleSelectAll}>{i18n.selectAll}</button>
                                            <button class="slds-button slds-button_neutral cfg-bulk-btn"
                                                onclick={handleUnselectAll}>{i18n.unselectAll}</button>
                                        </div>
                                    </div>
                                    <template if:true={hasCheckedItems}>
                                        <div class="cfg-section-label">{checkedSectionLabel}</div>
                                        <template for:each={checkedItems} for:item="item">
                                            <div key={item.key} class={item.rowClass}>
                                                <input type="checkbox" class="cfg-checkbox" checked
                                                    data-api={item.apiName} onchange={handleToggle} />
                                                <c-merge-object-config-row api-name={item.apiName}></c-merge-object-config-row>
                                                <div class="cfg-row-info">
                                                    <span class="cfg-obj-label">{item.schemaLabel}</span>
                                                    <span class="cfg-obj-api">{item.apiName}</span>
                                                </div>
                                                <div class="cfg-label-group">
                                                    <span class="cfg-label-hint">{i18n.labelDisplayLabel}</span>
                                                    <input type="text" class="slds-input cfg-label-input"
                                                        value={item.customLabel} placeholder={item.schemaLabel}
                                                        data-api={item.apiName} oninput={handleLabelChange} />
                                                </div>
                                            </div>
                                        </template>
                                    </template>
                                    <template if:true={hasUncheckedItems}>
                                        <div class="cfg-section-label cfg-section-label_dim">{uncheckedSectionLabel}</div>
                                        <div class="cfg-snapshot-warning">
                                            <lightning-icon icon-name="utility:warning" size="xx-small"
                                                class="cfg-snapshot-warning__icon" alternative-text="warning">
                                            </lightning-icon>
                                            <span>{i18n.configSnapshotWarning}</span>
                                        </div>
                                        <template for:each={uncheckedItems} for:item="item">
                                            <div key={item.key} class={item.rowClass}>
                                                <input type="checkbox" class="cfg-checkbox"
                                                    data-api={item.apiName} onchange={handleToggle} />
                                                <c-merge-object-config-row api-name={item.apiName}></c-merge-object-config-row>
                                                <div class="cfg-row-info">
                                                    <span class="cfg-obj-label">{item.schemaLabel}</span>
                                                    <span class="cfg-obj-api">{item.apiName}</span>
                                                </div>
                                                <div class="cfg-label-group">
                                                    <span class="cfg-label-hint">{i18n.labelDisplayLabel}</span>
                                                    <input type="text" class="slds-input cfg-label-input"
                                                        value={item.customLabel} placeholder={item.schemaLabel}
                                                        data-api={item.apiName} oninput={handleLabelChange} />
                                                </div>
                                            </div>
                                        </template>
                                    </template>

                                    <!-- Layer 3: manual add -->
                                    <div class="cfg-manual-add slds-m-top_small">
                                        <button class="slds-button slds-button_neutral cfg-manual-add__toggle"
                                            onclick={handleToggleManualAdd}>
                                            {i18n.manualAddBtn}
                                        </button>
                                        <template if:true={showManualAdd}>
                                            <div class="cfg-manual-add__form slds-m-top_x-small">
                                                <lightning-combobox
                                                    label={i18n.labelObject}
                                                    value={manualSelectedObj}
                                                    options={manualObjOptions}
                                                    onchange={handleManualObjChange}
                                                    class="cfg-manual-add__select">
                                                </lightning-combobox>
                                                <template if:true={hasManualFieldOptions}>
                                                    <lightning-combobox
                                                        label={i18n.manualFieldLabel}
                                                        value={manualSelectedField}
                                                        options={manualLookupOptions}
                                                        onchange={handleManualFieldChange}
                                                        class="cfg-manual-add__select slds-m-left_x-small">
                                                    </lightning-combobox>
                                                </template>
                                                <button class="slds-button slds-button_brand cfg-manual-add__btn"
                                                    disabled={manualAddDisabled}
                                                    onclick={handleManualAdd}>
                                                    {i18n.save}
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:false={hasItems}>
                                    <template if:false={errorMessage}>
                                        <div class="cfg-empty">
                                            <p>{i18n.emptyConfigPre} {selectedType}.</p>
                                        </div>
                                    </template>
                                </template>
                            </template>
                        </div>
                    </template>

                    <!-- ── Close Reasons ── -->
                    <template if:true={isReasonsSection}>
                        <div class="settings-panel__content">
                            <h3 class="settings-panel__title">{i18n.settingsNavReasons}</h3>

                            <!-- Sub-tabs: To Validate | Close -->
                            <div class="cfg-type-toggle slds-m-bottom_small">
                                <button class={reasonTabTvClass} data-tab="tv" onclick={handleReasonTabChange}>
                                    {i18n.tabToValidate}
                                </button>
                                <button class={reasonTabClClass} data-tab="cl" onclick={handleReasonTabChange}>
                                    {i18n.tabCloseTicket}
                                </button>
                            </div>

                            <template if:true={reasonError}>
                                <div class="cfg-error slds-m-bottom_small">{reasonError}</div>
                            </template>

                            <template if:true={isReasonLoading}>
                                <div class="slds-text-align_center slds-p-around_medium">
                                    <lightning-spinner size="small" alternative-text={i18n.loading}></lightning-spinner>
                                </div>
                            </template>

                            <template if:false={isReasonLoading}>

                                <!-- ── To Validate tab ── -->
                                <template if:true={isReasonTabTv}>
                                    <div class="cfg-section-label">{i18n.predefinedLabel}</div>
                                    <ul class="reason-list">
                                        <template for:each={tvPredefinedItems} for:item="r">
                                            <li key={r.key} class="reason-item reason-item_editable">
                                                <template if:false={r.isEditing}>
                                                    <span class="reason-item__display">{r.label}</span>
                                                    <template if:true={r.isModified}>
                                                        <button class="reason-item__reset"
                                                            title={i18n.btnReopen}
                                                            data-key={r.key} data-tab="tv"
                                                            onclick={handleReasonReset}>↺</button>
                                                    </template>
                                                    <button class="reason-item__pencil"
                                                        data-key={r.key} data-tab="tv"
                                                        onclick={handleEditStart}
                                                        title="Modifier">
                                                        <lightning-icon icon-name="utility:edit" size="xx-small"
                                                            class="reason-item__edit-icon" alternative-text="edit">
                                                        </lightning-icon>
                                                    </button>
                                                </template>
                                                <template if:true={r.isEditing}>
                                                    <input type="text" class="slds-input reason-item__input"
                                                        value={r.label}
                                                        placeholder={r.placeholder}
                                                        data-key={r.key} data-tab="tv"
                                                        oninput={handleReasonLabelChange}
                                                        onblur={handleEditEnd} />
                                                </template>
                                            </li>
                                        </template>
                                    </ul>

                                    <div class="cfg-section-label slds-m-top_small">{i18n.customReasonsLabel}</div>
                                    <template if:true={hasTvCustomItems}>
                                        <ul class="reason-list">
                                            <template for:each={tvCustomItems} for:item="r">
                                                <li key={r.id} class="reason-item reason-item_custom reason-item_editable">
                                                    <template if:false={r.isEditing}>
                                                        <span class="reason-item__display">{r.value}</span>
                                                        <button class="reason-item__remove"
                                                            data-id={r.id} data-tab="tv"
                                                            onclick={handleRemoveCustomReason}
                                                            title={i18n.btnRemove}>&#x2715;</button>
                                                        <button class="reason-item__pencil"
                                                            data-id={r.id} data-tab="tv"
                                                            onclick={handleEditStart}
                                                            title="Modifier">
                                                            <lightning-icon icon-name="utility:edit" size="xx-small"
                                                                class="reason-item__edit-icon" alternative-text="edit">
                                                            </lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:true={r.isEditing}>
                                                        <input type="text" class="slds-input reason-item__input"
                                                            value={r.value}
                                                            data-id={r.id} data-tab="tv"
                                                            oninput={handleCustomReasonChange}
                                                            onblur={handleEditEnd} />
                                                    </template>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasTvCustomItems}>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                            {i18n.noCustomReasons}
                                        </p>
                                    </template>

                                    <div class="reason-add-row slds-m-top_small">
                                        <input type="text" class="slds-input"
                                            placeholder={i18n.placeholderNewTvReason}
                                            value={newTvReason}
                                            data-tab="tv"
                                            oninput={handleNewReasonInput} />
                                        <button class="slds-button slds-button_neutral reason-add-btn"
                                            data-tab="tv"
                                            onclick={addCustomReason}>
                                            {i18n.btnAddReason}
                                        </button>
                                    </div>
                                </template>

                                <!-- ── Close tab ── -->
                                <template if:true={isReasonTabCl}>
                                    <div class="cfg-section-label">{i18n.predefinedLabel}</div>
                                    <ul class="reason-list">
                                        <template for:each={clPredefinedItems} for:item="r">
                                            <li key={r.key} class="reason-item reason-item_editable">
                                                <template if:false={r.isEditing}>
                                                    <span class="reason-item__display">{r.label}</span>
                                                    <template if:true={r.isModified}>
                                                        <button class="reason-item__reset"
                                                            title={i18n.btnReopen}
                                                            data-key={r.key} data-tab="cl"
                                                            onclick={handleReasonReset}>↺</button>
                                                    </template>
                                                    <button class="reason-item__pencil"
                                                        data-key={r.key} data-tab="cl"
                                                        onclick={handleEditStart}
                                                        title="Modifier">
                                                        <lightning-icon icon-name="utility:edit" size="xx-small"
                                                            class="reason-item__edit-icon" alternative-text="edit">
                                                        </lightning-icon>
                                                    </button>
                                                </template>
                                                <template if:true={r.isEditing}>
                                                    <input type="text" class="slds-input reason-item__input"
                                                        value={r.label}
                                                        placeholder={r.placeholder}
                                                        data-key={r.key} data-tab="cl"
                                                        oninput={handleReasonLabelChange}
                                                        onblur={handleEditEnd} />
                                                </template>
                                            </li>
                                        </template>
                                    </ul>

                                    <div class="cfg-section-label slds-m-top_small">{i18n.customReasonsLabel}</div>
                                    <template if:true={hasClCustomItems}>
                                        <ul class="reason-list">
                                            <template for:each={clCustomItems} for:item="r">
                                                <li key={r.id} class="reason-item reason-item_custom reason-item_editable">
                                                    <template if:false={r.isEditing}>
                                                        <span class="reason-item__display">{r.value}</span>
                                                        <button class="reason-item__remove"
                                                            data-id={r.id} data-tab="cl"
                                                            onclick={handleRemoveCustomReason}
                                                            title={i18n.btnRemove}>&#x2715;</button>
                                                        <button class="reason-item__pencil"
                                                            data-id={r.id} data-tab="cl"
                                                            onclick={handleEditStart}
                                                            title="Modifier">
                                                            <lightning-icon icon-name="utility:edit" size="xx-small"
                                                                class="reason-item__edit-icon" alternative-text="edit">
                                                            </lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:true={r.isEditing}>
                                                        <input type="text" class="slds-input reason-item__input"
                                                            value={r.value}
                                                            data-id={r.id} data-tab="cl"
                                                            oninput={handleCustomReasonChange}
                                                            onblur={handleEditEnd} />
                                                    </template>
                                                </li>
                                            </template>
                                        </ul>
                                    </template>
                                    <template if:false={hasClCustomItems}>
                                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                                            {i18n.noCustomReasons}
                                        </p>
                                    </template>

                                    <div class="reason-add-row slds-m-top_small">
                                        <input type="text" class="slds-input"
                                            placeholder={i18n.placeholderNewClReason}
                                            value={newClReason}
                                            data-tab="cl"
                                            oninput={handleNewReasonInput} />
                                        <button class="slds-button slds-button_neutral reason-add-btn"
                                            data-tab="cl"
                                            onclick={addCustomReason}>
                                            {i18n.btnAddReason}
                                        </button>
                                    </div>
                                </template>

                            </template>
                        </div>
                    </template>

                </div>
            </div>

            <!-- Footer -->
            <footer class="slds-modal__footer">
                <lightning-button label={i18n.close} variant="neutral" onclick={handleClose}></lightning-button>
                <template if:true={isLanguageSection}>
                    <lightning-button label={i18n.save} variant="brand" onclick={handleLangSave}>
                    </lightning-button>
                </template>
                <template if:true={isObjectsSection}>
                    <lightning-button label={saveLabel} variant="brand"
                        disabled={isSaving} onclick={handleSave}>
                    </lightning-button>
                </template>
                <template if:true={isReasonsSection}>
                    <lightning-button label={reasonSaveLabel} variant="brand"
                        disabled={isReasonSaving} onclick={handleReasonSave}>
                    </lightning-button>
                </template>
            </footer>

        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>
