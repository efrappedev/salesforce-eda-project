                    </div>

                    <template if:true={isLoadingAudit}>
                        <div class="loading-container">
                            <lightning-spinner size="medium"></lightning-spinner>
                        </div>
                    </template>

                    <template if:false={isLoadingAudit}>
                        <template if:true={hasAuditLog}>
                            <div class="audit-table-wrapper">
                                <table class="data-table audit-table">
                                    <thead>
                                        <tr>
                                            <th>Log #</th>
                                            <th>Ticket</th>
                                            <th>Action</th>
                                            <th>Account</th>
                                            <th>Performed By</th>
                                            <th>Date &amp; Time</th>
                                            <th>Notes</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={auditLogList} for:item="log">
                                            <tr key={log.Id}>
                                                <td class="audit-td--mono">{log.Name}</td>
                                                <td class="audit-td--mono">{log.ticketName}</td>
                                                <td><span class={log.actionClass}>{log.Action__c}</span></td>
                                                <td>{log.accountName}</td>
                                                <td>{log.performedByName}</td>
                                                <td class="audit-td--date">{log.performedAtDisplay}</td>
                                                <td class="audit-td--notes">{log.Notes__c}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="audit-count">{auditLogCount} entries (most recent first, max 200)</div>
                        </template>
                        <template if:false={hasAuditLog}>
                            <div class="empty-list">No audit log entries yet. Entries are created automatically when tickets are resolved, created, or rolled back.</div>
                        </template>
                    </template>

                </div>
            </template>

        </div>

        <!-- ══════════════════════════════════════════════════════════════
             SETTINGS MODAL OVERLAY
        ══════════════════════════════════════════════════════════════ -->
        <template if:true={showSettings}>
            <div class="sm-backdrop" onclick={handleCloseSettings}>
                <div class="sm-dialog" onclick={handleDialogClick}>

                    <!-- Modal header -->
                    <div class="sm-header">
                        <span class="sm-header__title">{lbl.settingsTitle}</span>
                        <button class="sm-close-btn" onclick={handleCloseSettings} title="Close">
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>

                    <!-- Modal body: two columns -->
                    <div class="sm-body">

                        <!-- Left nav -->
                        <div class="sm-nav">
                            <button class={navLangClass} data-section="language" onclick={handleSettingsSectionChange}>
                                {lbl.langSection}
                            </button>
                            <button class={navTasksClass} data-section="tasks" onclick={handleSettingsSectionChange}>
                                {lbl.taskSection}
                            </button>
                            <button class={navLapsedClass} data-section="lapsed" onclick={handleSettingsSectionChange}>
                                {lbl.lapsedSection}
                            </button>
                            <template if:true={hasDmcSettings}>
                                <button class={navImportClass} data-section="import" onclick={handleSettingsSectionChange}>
                                    CSV Import
                                </button>
                                <button class={navCredsClass} data-section="credentials" onclick={handleSettingsSectionChange}>
                                    {lbl.credSection}
                                </button>
                            </template>
                        </div>

                        <!-- Right content -->
                        <div class="sm-content">
                            <template if:true={isLoadingSettings}>
                                <div class="sm-content__loading">
                                    <lightning-spinner size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template if:false={isLoadingSettings}>

                                <!-- ── Language ──────────────────────────────── -->
                                <template if:true={isSettingsLang}>
                                    <div class="sm-section-title">{lbl.langSection}</div>
                                    <p class="sm-section-desc">{lbl.langLabel}</p>
                                    <div class="lang-pill-group">
                                        <button class={langBtnEnClass} data-lang="en" onclick={handleLangPillClick}>
                                            EN — English
                                        </button>
                                        <button class={langBtnFrClass} data-lang="fr" onclick={handleLangPillClick}>
                                            FR — Français
                                        </button>
                                    </div>
                                </template>

                                <!-- ── Pending Ticket Tasks ───────────────────── -->
                                <template if:true={isSettingsTasks}>
                                    <div class="sm-section-title">{lbl.taskSection}</div>
                                    <div class="sm-section-body">
                                        <lightning-input
                                            type="checkbox"
                                            label={lbl.taskEnable}
                                            checked={autoTaskEnabled}
                                            onchange={handleAutoTaskToggle}>
                                        </lightning-input>
                                        <template if:true={autoTaskEnabled}>
                                            <div class="settings-sub">
                                                <lightning-input
                                                    type="number"
                                                    label={lbl.taskDueDays}
                                                    value={taskDueDays}
                                                    min="1"
                                                    max="90"
                                                    onchange={handleTaskDueDaysChange}
                                                    class="settings-number-narrow">
                                                </lightning-input>
                                                <div class="settings-owner-picker">
                                                    <label class="settings-owner-label">{lbl.taskAssignTo}</label>
                                                    <template if:true={taskOwnerName}>
                                                        <div class="owner-chip">
                                                            <span>{taskOwnerName}</span>
                                                            <button class="owner-chip__clear" onclick={handleClearTaskOwner}>✕</button>
                                                        </div>
                                                    </template>
                                                    <template if:false={taskOwnerName}>
                                                        <div class="owner-search-wrap">
                                                            <lightning-icon icon-name="utility:search" size="xx-small" class="owner-search-icon"></lightning-icon>
                                                            <input
                                                                type="text"
                                                                class="owner-search-input"
                                                                placeholder={lbl.taskSearchPlaceholder}
                                                                value={taskOwnerSearch}
                                                                onfocus={handleTaskOwnerFocus}
                                                                onkeyup={handleTaskOwnerSearch} />
                                                        </div>
                                                        <template if:true={hasTaskOwnerResults}>
                                                            <ul class="owner-dropdown">
                                                                <template for:each={taskOwnerResults} for:item="r">
                                                                    <li key={r.id}
                                                                        class="owner-dropdown__item"
                                                                        data-id={r.id}
                                                                        data-name={r.name}
                                                                        onclick={handleSelectTaskOwner}>
                                                                        <span class="owner-type-badge">{r.type}</span>
                                                                        {r.name}
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </template>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── Lapsed Donor Alerts ────────────────────── -->
                                <template if:true={isSettingsLapsed}>
                                    <div class="sm-section-title">{lbl.lapsedSection}</div>
                                    <div class="sm-section-body">
                                        <lightning-input
                                            type="checkbox"
                                            label={lbl.lapsedEnable}
                                            checked={lapsedEnabled}
                                            onchange={handleLapsedToggle}>
                                        </lightning-input>
                                        <template if:true={lapsedEnabled}>
                                            <div class="settings-sub">
                                                <lightning-input
                                                    type="number"
                                                    label={lbl.lapsedDays}
                                                    value={lapsedDays}
                                                    min="30"
                                                    max="3650"
                                                    onchange={handleLapsedDaysChange}
                                                    class="settings-number-narrow">
                                                </lightning-input>
                                                <lightning-combobox
                                                    label={lbl.lapsedFrequencyLabel}
                                                    value={lapsedFrequency}
                                                    options={frequencyOptions}
                                                    onchange={handleLapsedFrequencyChange}>
                                                </lightning-combobox>
                                                <template if:true={showLapsedDayPicker}>
                                                    <lightning-combobox
                                                        label={lbl.lapsedSchedule}
                                                        value={lapsedScheduleDay}
                                                        options={scheduleDayOptions}
                                                        onchange={handleLapsedScheduleChange}>
                                                    </lightning-combobox>
                                                </template>
                                                <div class="settings-owner-picker">
                                                    <label class="settings-owner-label">{lbl.lapsedAssignTo}</label>
                                                    <template if:true={lapsedOwnerName}>
                                                        <div class="owner-chip">
                                                            <span>{lapsedOwnerName}</span>
                                                            <button class="owner-chip__clear" onclick={handleClearLapsedOwner}>✕</button>
                                                        </div>
                                                    </template>
                                                    <template if:false={lapsedOwnerName}>
                                                        <div class="owner-search-wrap">
                                                            <lightning-icon icon-name="utility:search" size="xx-small" class="owner-search-icon"></lightning-icon>
                                                            <input
                                                                type="text"
                                                                class="owner-search-input"
                                                                placeholder={lbl.taskSearchPlaceholder}
                                                                value={lapsedOwnerSearch}
                                                                onfocus={handleLapsedOwnerFocus}
                                                                onkeyup={handleLapsedOwnerSearch} />
                                                        </div>
                                                        <template if:true={hasLapsedOwnerResults}>
                                                            <ul class="owner-dropdown">
                                                                <template for:each={lapsedOwnerResults} for:item="r">
                                                                    <li key={r.id}
                                                                        class="owner-dropdown__item"
                                                                        data-id={r.id}
                                                                        data-name={r.name}
                                                                        onclick={handleSelectLapsedOwner}>
                                                                        <span class="owner-type-badge">{r.type}</span>
                                                                        {r.name}
                                                                    </li>
                                                                </template>
                                                            </ul>
                                                        </template>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- ── CSV Import (admin only) ───────────────── -->
                                <template if:true={isSettingsImport}>
                                    <div class="sm-section-title">CSV Import</div>
                                    <div class="sm-section-body">

                                        <p class="sm-section-desc">
                                            Upload a CSV file to bulk-create Pending Review tickets from historical Zeffy donations.
                                            Up to 500 rows per batch — large files are split automatically.
                                            Duplicate transaction IDs are skipped.
                                        </p>

                                        <!-- Template download -->
                                        <div class="import-template-row">
                                            <button class="import-template-btn" onclick={handleDownloadTemplate}>
                                                <lightning-icon icon-name="utility:download" size="xx-small"></lightning-icon>
                                                Download CSV Template
                                            </button>
                                        </div>

                                        <!-- File picker -->
                                        <template if:false={importHasRows}>
                                            <label class="import-drop-zone">
                                                <lightning-icon icon-name="utility:upload" size="small" class="import-drop-zone__icon"></lightning-icon>
                                                <span class="import-drop-zone__text">Click to select a CSV file</span>
                                                <input type="file" accept=".csv" class="import-file-input" onchange={handleImportFileChange} />
                                            </label>
                                        </template>

                                        <!-- File loaded — ready to import -->
                                        <template if:true={importHasRows}>
                                            <div class="import-file-ready">
                                                <lightning-icon icon-name="utility:file" size="x-small"></lightning-icon>
                                                <span class="import-file-ready__name">{importFileName}</span>
                                                <span class="import-file-ready__count">{importRows.length} rows</span>
                                                <button class="import-file-clear" onclick={handleClearImport} title="Remove">✕</button>
                                            </div>

                                            <!-- Progress bar (while importing) -->
                                            <template if:true={isImporting}>
                                                <div class="import-progress-wrap">
                                                    <div class="import-progress-bar">
                                                        <div class="import-progress-fill" style={importProgressStyle}></div>
                                                    </div>
                                                    <span class="import-progress-label">{importDone} / {importTotal} imported…</span>
                                                </div>
                                            </template>

                                            <!-- Results (after import) -->
                                            <template if:true={importComplete}>
                                                <div class="import-results">
                                                    <div class="import-results__row import-results__row--ok">
                                                        <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                                        {importDone} tickets created
                                                    </div>
                                                    <template if:true={importSkipped}>
                                                        <div class="import-results__row import-results__row--skip">
                                                            <lightning-icon icon-name="utility:skip" size="xx-small"></lightning-icon>
                                                            {importSkipped} duplicates skipped
                                                        </div>
                                                    </template>
                                                    <template if:true={importHasErrors}>
                                                        <div class="import-results__row import-results__row--err">
                                                            <lightning-icon icon-name="utility:error" size="xx-small"></lightning-icon>
                                                            {importErrors.length} errors
                                                        </div>
                                                        <template for:each={importErrors} for:item="err">
                                                            <div key={err} class="import-error-item">{err}</div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>

                                            <!-- Import button -->
                                            <template if:false={importComplete}>
                                                <button class="import-start-btn" disabled={isImporting} onclick={handleStartImport}>
                                                    <lightning-icon icon-name="utility:upload" size="xx-small"></lightning-icon>
                                                    Import {importRows.length} Tickets
                                                </button>
                                            </template>
                                            <template if:true={importComplete}>
                                                <button class="import-template-btn" onclick={handleClearImport}>
                                                    Import another file
                                                </button>
                                            </template>
                                        </template>

                                    </div>
                                </template>

                                <!-- ── Zeffy Credentials (admin only) ─────────── -->
                                <template if:true={isSettingsCreds}>
                                    <div class="sm-section-title">{lbl.credSection}</div>
                                    <div class="sm-section-body">
                                        <lightning-input
                                            type="checkbox"
                                            label={lbl.credActive}
                                            checked={settingsIsActive}
                                            onchange={handleSettingsActiveChange}>
                                        </lightning-input>
                                        <div class="settings-hint">
                                            Current values are masked. Type a new value to replace — leave blank to keep existing.
                                        </div>
                                        <lightning-input
                                            type="password"
                                            label={lbl.credApiKey}
                                            placeholder={settingsApiKey}
                                            value={settingsApiKey}
                                            onchange={handleSettingsApiKeyChange}>
                                        </lightning-input>
                                        <lightning-input
                                            type="password"
                                            label={lbl.credSecret}
                                            placeholder={settingsSecret}
                                            value={settingsSecret}
                                            onchange={handleSettingsSecretChange}>
                                        </lightning-input>
                                        <div class="settings-section--info">
                                            <div class="settings-section__title">{lbl.credInfo}</div>
                                            <ul class="settings-list">
                                                <li>{lbl.credInfoLine1}</li>
                                                <li>{lbl.credInfoLine2}</li>
                                                <li>Webhook URL: <code>/dmc/webhook/receive</code></li>
                                            </ul>
                                        </div>
                                    </div>
                                </template>

                            </template>
                        </div>
                    </div>

                    <!-- Modal footer -->
                    <div class="sm-footer">
                        <lightning-button
                            label="Close"
                            variant="neutral"
                            onclick={handleCloseSettings}>
                        </lightning-button>
                        <template if:true={showModalSaveBtn}>
                            <lightning-button
                                label={saveAppBtnLabel}
                                variant="brand"
                                disabled={isSavingAppSettings}
                                onclick={handleModalSave}>
                            </lightning-button>
                        </template>
                    </div>

                </div>
            </div>
        </template>

    </div>
</template>
